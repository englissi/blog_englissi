<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>한국어 개입 차단 직결 트레이너 (50개 장면)</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --accent: #38bdf8;
      --primary: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --danger: #f43f5e;
      --success: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem 0.75rem 2rem;
    }

    .container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    header {
      text-align: center;
      padding: 0.5rem 0;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    header p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .display-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.5rem 1rem 1.25rem;
      text-align: center;
      min-height: 370px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .step-badge {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: #1e293b;
      color: var(--accent);
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .speaking-status {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
    }

    .speaking .dot {
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    /* 1초 상황 씬 캔버스 */
    .scene-viewport {
      width: 140px;
      height: 120px;
      background: #060911;
      border-radius: 1rem;
      border: 1px solid #23304a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 0.9rem;
      overflow: hidden;
    }

    .scene-icon {
      font-size: 3rem;
      display: inline-block;
      transform-origin: center bottom;
    }

    /* 직관 모션 */
    .motion-crash { animation: animCrash 1.1s cubic-bezier(0.25, 1, 0.5, 1) infinite; }
    .motion-pulse { animation: animPulse 1s ease-in-out infinite; }
    .motion-drop { animation: animDrop 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite; }
    .motion-shake { animation: animShake 0.8s ease-in-out infinite; }
    .motion-spin { animation: animSpin 1.4s linear infinite; }
    .motion-slide { animation: animSlide 1.2s ease-in-out infinite; }

    @keyframes animCrash {
      0% { transform: translateY(-30px) rotate(-20deg); opacity: 0; }
      40% { transform: translateY(6px) rotate(85deg); opacity: 1; }
      55% { transform: translateY(0px) rotate(85deg); }
      70%, 100% { transform: translateY(3px) rotate(85deg); }
    }
    @keyframes animPulse {
      0%, 100% { transform: scale(0.92); opacity: 0.6; }
      50% { transform: scale(1.18); opacity: 1; filter: drop-shadow(0 0 10px #38bdf8); }
    }
    @keyframes animDrop {
      0% { transform: translateY(-25px); opacity: 0; }
      50% { transform: translateY(12px); opacity: 1; }
      60% { transform: translateY(8px); }
      70%, 100% { transform: translateY(12px); opacity: 0.8; }
    }
    @keyframes animShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px) rotate(-8deg); }
      40% { transform: translateX(6px) rotate(8deg); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    @keyframes animSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes animSlide {
      0% { transform: translateX(-25px); opacity: 0; }
      50% { transform: translateX(5px); opacity: 1; }
      100% { transform: translateX(25px); opacity: 0; }
    }

    .circuit-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.75rem;
      background: rgba(99, 102, 241, 0.18);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
    }

    .current-ko {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
      line-height: 1.4;
      word-break: keep-all;
    }

    .current-ko.active {
      color: #fff;
      font-weight: 700;
    }

    .current-en {
      font-size: 1.35rem;
      font-weight: 800;
      color: #64748b;
      line-height: 1.35;
      word-break: keep-all;
      transition: color 0.2s;
    }

    .current-en.active {
      color: var(--accent);
    }

    .repeat-counter {
      margin-top: 0.8rem;
      font-size: 0.85rem;
      color: var(--success);
      font-weight: 700;
      min-height: 1.2rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.65rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    button:active {
      transform: scale(0.96);
    }

    button.btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .settings-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.6rem;
      font-size: 0.85rem;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    select {
      background: #090d16;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.3rem 0.5rem;
      border-radius: 0.4rem;
      outline: none;
      font-size: 0.85rem;
    }

    .list-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
    }

    .list-header {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
    }

    .sentence-list {
      list-style: none;
      max-height: 360px;
      overflow-y: auto;
    }

    .sentence-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1e293b44;
      cursor: pointer;
    }

    .sentence-item:last-child {
      border-bottom: none;
    }

    .sentence-item.playing {
      background: rgba(99, 102, 241, 0.15);
      border-left: 4px solid var(--accent);
    }

    .item-ko {
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
      color: #cbd5e1;
    }

    .item-circuit {
      font-size: 0.8rem;
      color: #a5b4fc;
      margin-bottom: 0.2rem;
    }

    .item-en {
      font-size: 0.95rem;
      font-weight: 700;
      color: #bae6fd;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>한국어 개입 차단 직결 트레이너</h1>
    <p>한글 번역기를 끄고 1초 짤 이미지를 본 직후 바로 뱉으세요.</p>
  </header>

  <div class="display-card" id="displayCard">
    <div class="step-badge" id="stepBadge">Scene 1 / 50</div>
    <div class="speaking-status" id="speakingStatus">
      <div class="dot"></div>
      <span id="statusText">정지</span>
    </div>

    <!-- 1초 상황 짤 뷰포트 -->
    <div class="scene-viewport">
      <div class="scene-icon" id="sceneIcon">🎬</div>
    </div>

    <div class="circuit-pill" id="circuitPill">직결 회로: [장면 캡처]</div>
    <div class="current-ko" id="currentKo">재생 버튼을 터치해 이미지 훈련을 시작하세요.</div>
    <div class="current-en" id="currentEn">Tap Play to Start</div>
    <div class="repeat-counter" id="repeatCounter"></div>
  </div>

  <div class="controls">
    <button id="prevBtn">⏮ 이전</button>
    <button class="btn-primary" id="playPauseBtn">▶ 전체 재생</button>
    <button id="nextBtn">다음 ⏭</button>
    <button id="stopBtn">⏹ 정지</button>
    <button id="randomBtn">🔀 랜덤: OFF</button>
  </div>

  <div class="settings-bar">
    <div class="setting-item">
      <label for="speedSelect">속도:</label>
      <select id="speedSelect">
        <option value="0.85">0.85x</option>
        <option value="0.95" selected>1.0x (표준)</option>
        <option value="1.1">1.1x</option>
      </select>
    </div>
    <div class="setting-item">
      <label for="intervalSelect">대기 시간:</label>
      <select id="intervalSelect">
        <option value="600">0.6초 (스피드)</option>
        <option value="1200" selected>1.2초 (표준)</option>
        <option value="2000">2.0초 (따라하기)</option>
      </select>
    </div>
  </div>

  <div class="list-card">
    <div class="list-header">
      <span>50개 무성 영화 씬 목록</span>
      <span>터치 시 해당 번호 이동</span>
    </div>
    <ul class="sentence-list" id="sentenceList"></ul>
  </div>
</div>

    { id: 46, icon: "🌬️", motion: "motion-slide", ko: "차 창문 내리자 시원한 바람이 붊", circuit: "[날리는 머리] + Breeze", en: "The cool breeze feels amazing." },
    { id: 47, icon: "🗄️", motion: "motion-shake", ko: "서랍을 열고 물건들을 마구 뒤적임", circuit: "[뒤섞인 물건] + Look for", en: "I'm digging through this drawer." },
    { id: 48, icon: "🍵", motion: "motion-pulse", ko: "따뜻한 머그잔을 두 손으로 감싸 쥠", circuit: "[모락모락 김] + Warm", en: "This hot tea warms my hands." },
    { id: 49, icon: "🚦", motion: "motion-pulse", ko: "초록 불 깜빡이는 횡단보도로 뜀", circuit: "[가쁜 숨] + Sprint", en: "I'm running for the green light." },
    { id: 50, icon: "🌚", motion: "motion-pulse", ko: "불을 끄자마자 방이 캄캄해짐", circuit: "[암전] + Dark", en: "The room went pitch dark." }
  ];

  let playlist = [...rawBank];
  let currentIndex = 0;
  let isRunning = false;
  let isRandom = false;
  let synth = window.speechSynthesis;
  let voices = [];
  let isUnlocked = false;

  const playPauseBtn = document.getElementById("playPauseBtn");
  const stopBtn = document.getElementById("stopBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const randomBtn = document.getElementById("randomBtn");
  const sceneIcon = document.getElementById("sceneIcon");
  const circuitPill = document.getElementById("circuitPill");
  const currentKo = document.getElementById("currentKo");
  const currentEn = document.getElementById("currentEn");
  const repeatCounter = document.getElementById("repeatCounter");
  const stepBadge = document.getElementById("stepBadge");
  const speakingStatus = document.getElementById("speakingStatus");
  const statusText = document.getElementById("statusText");
  const sentenceList = document.getElementById("sentenceList");
  const speedSelect = document.getElementById("speedSelect");
  const intervalSelect = document.getElementById("intervalSelect");

  function initVoices() {
    voices = synth.getVoices() || [];
  }
  initVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = initVoices;
  }

  function unlockAudio() {
    if (isUnlocked) return;
    try {
      const dummy = new SpeechSynthesisUtterance(" ");
      dummy.volume = 0.01;
      dummy.rate = 2.0;
      synth.speak(dummy);
      isUnlocked = true;
    } catch(e){}
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderList() {
    sentenceList.innerHTML = "";
    rawBank.forEach((item, idx) => {
      const li = document.createElement("li");
      li.className = "sentence-item";
      li.id = `item-${item.id}`;
      li.innerHTML = `
        <div class="item-ko">${item.id}. ${item.icon} ${item.ko}</div>
        <div class="item-circuit">회로: ${item.circuit}</div>
        <div class="item-en">${item.en}</div>
      `;
      li.addEventListener("click", () => {
        unlockAudio();
        stopPlayback();
        const found = playlist.findIndex(p => p.id === item.id);
        currentIndex = found !== -1 ? found : 0;
        updateUI();
        startCycle();
      });
      sentenceList.appendChild(li);
    });
  }

  function updateUI() {
    const curr = playlist[currentIndex];
    document.querySelectorAll(".sentence-item").forEach(el => el.classList.remove("playing"));
    const activeLi = document.getElementById(`item-${curr.id}`);
    if (activeLi) {
      activeLi.classList.add("playing");
      activeLi.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    stepBadge.innerText = `Scene ${currentIndex + 1} / ${playlist.length}`;
    circuitPill.innerText = `직결 회로: ${curr.circuit}`;
    currentKo.innerText = curr.ko;
    currentEn.innerText = curr.en;
    sceneIcon.innerText = curr.icon;

    sceneIcon.className = "scene-icon";
    void sceneIcon.offsetWidth;
    sceneIcon.classList.add(curr.motion);
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function speakTextMobile(text, lang, rate = 1.0) {
    return new Promise((resolve) => {
      if (!isRunning) return resolve();
      synth.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = rate;

      if (!voices || voices.length === 0) voices = synth.getVoices() || [];
      if (voices.length > 0) {
        if (lang.startsWith("ko")) {
          const koVoice = voices.find(v => v.lang && (v.lang.includes("ko") || v.lang.includes("KR")));
          if (koVoice) utter.voice = koVoice;
        } else {
          const enVoice = voices.find(v => v.lang && (v.lang.includes("en-US") || v.lang.includes("en_US"))) || voices.find(v => v.lang && v.lang.startsWith("en"));
          if (enVoice) utter.voice = enVoice;
        }
      }

      let isDone = false;
      function finish() {
        if (!isDone) {
          isDone = true;
          clearTimeout(timeout);
          resolve();
        }
      }

      utter.onend = finish;
      utter.onerror = finish;

      const dur = (text.length / 5) * 1000 * (1 / rate) + 3500;
      const timeout = setTimeout(finish, dur);

      try {
        synth.speak(utter);
      } catch(e) {
        finish();
      }
    });
  }

  async function playCycle(index) {
    if (!isRunning) return;
    const item = playlist[index];
    const enSpeed = parseFloat(speedSelect.value);
    const delay = parseInt(intervalSelect.value);

    // 1단계: 상황 씬 제시
    currentKo.classList.add("active");
    currentEn.classList.remove("active");
    repeatCounter.innerText = "🎬 [1/3] 장면 캡처 (한국어 차단)";
    statusText.innerText = "상황 묘사";
    speakingStatus.classList.add("speaking");

    await speakTextMobile(item.ko, "ko-KR", 1.0);
    currentKo.classList.remove("active");
    await sleep(350);

    if (!isRunning) return;

    // 2단계: 영어 직결 1회
    currentEn.classList.add("active");
    repeatCounter.innerText = "🇺🇸 [2/3] 직결 반사 영어 1회";
    statusText.innerText = "영어 1회";
    await speakTextMobile(item.en, "en-US", enSpeed);
    await sleep(delay);

    if (!isRunning) return;

    // 3단계: 영어 직결 2회 (따라하기)
    repeatCounter.innerText = "🔁 [3/3] 직결 반사 영어 2회 (따라 말하기)";
    statusText.innerText = "영어 2회";
    await speakTextMobile(item.en, "en-US", Math.max(0.75, enSpeed * 0.92));
    currentEn.classList.remove("active");
    speakingStatus.classList.remove("speaking");
    statusText.innerText = "대기";
    repeatCounter.innerText = "";
    await sleep(delay);
  }

  async function startCycle() {
    unlockAudio();
    isRunning = true;
    playPauseBtn.innerText = "⏸ 일시정지";
    playPauseBtn.classList.remove("btn-primary");

    while (isRunning && currentIndex < playlist.length) {
      updateUI();
      await playCycle(currentIndex);
      if (!isRunning) break;
      if (currentIndex < playlist.length - 1) {
        currentIndex++;
      } else {
        if (isRandom) {
          playlist = shuffle(rawBank);
        }
        currentIndex = 0;
        break;
      }
    }

    if (currentIndex === 0 && !isRunning) {
      stopPlayback();
    }
  }

  function stopPlayback() {
    isRunning = false;
    synth.cancel();
    playPauseBtn.innerText = "▶ 전체 재생";
    playPauseBtn.classList.add("btn-primary");
    speakingStatus.classList.remove("speaking");
    statusText.innerText = "정지";
    repeatCounter.innerText = "";
    currentKo.classList.remove("active");
    currentEn.classList.remove("active");
  }

  playPauseBtn.addEventListener("click", () => {
    if (isRunning) stopPlayback();
    else startCycle();
  });

  stopBtn.addEventListener("click", () => {
    stopPlayback();
    currentIndex = 0;
    updateUI();
  });

  prevBtn.addEventListener("click", () => {
    const wasRunning = isRunning;
    stopPlayback();
    if (currentIndex > 0) currentIndex--;
    updateUI();
    if (wasRunning) startCycle();
  });

  nextBtn.addEventListener("click", () => {
    const wasRunning = isRunning;
    stopPlayback();
    if (currentIndex < playlist.length - 1) currentIndex++;
    updateUI();
    if (wasRunning) startCycle();
  });

  randomBtn.addEventListener("click", () => {
    isRandom = !isRandom;
    randomBtn.innerText = isRandom ? "🔀 랜덤: ON" : "🔀 랜덤: OFF";
    randomBtn.style.color = isRandom ? "#38bdf8" : "#fff";
    playlist = isRandom ? shuffle(rawBank) : [...rawBank];
    currentIndex = 0;
    updateUI();
  });

  renderList();
  updateUI();
</script>

</body>
</html>
