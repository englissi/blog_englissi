<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>워킹맘·직장인 1초 쉐도잉 트레이너 50</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --primary: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --success: #34d399;
      --danger: #f87171;
      --cue: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 0.8rem 0.75rem 2.5rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    header {
      text-align: center;
      padding: 0.3rem 0;
    }

    header h1 {
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
    }

    header p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .stage-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.4rem 1.1rem 1.3rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      position: relative;
    }

    .top-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meta-badge {
      background: #1e293b;
      color: var(--accent);
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .part-tag {
      font-size: 0.72rem;
      color: #f472b6;
      background: rgba(244, 114, 182, 0.15);
      border: 1px solid rgba(244, 114, 182, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-weight: 600;
    }

    /* 상황 제시 박스 */
    .scene-box {
      background: #090d16;
      border: 1px solid #22324f;
      border-radius: 0.9rem;
      padding: 0.9rem 1rem;
    }

    .scene-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--cue);
      margin-bottom: 0.25rem;
    }

    .scene-ko {
      font-size: 1.05rem;
      font-weight: 800;
      color: #f8fafc;
      line-height: 1.4;
    }

    /* 쉐도잉 타깃 영문 */
    .shadow-target-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 0.9rem;
      padding: 1.1rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      text-align: center;
      transition: all 0.25s;
    }

    .shadow-target-box.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
      box-shadow: 0 0 18px var(--accent-glow);
    }

    .shadow-step-cue {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    .target-en {
      font-size: 1.3rem;
      font-weight: 800;
      color: #94a3b8;
      line-height: 1.4;
      word-break: keep-all;
      transition: color 0.2s;
    }

    .shadow-target-box.active .target-en {
      color: #fff;
    }

    /* 음성 싱크 보드 */
    .sync-board {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 0.85rem;
      padding: 0.8rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .sync-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
    }

    .rec-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--muted);
    }

    .rec-indicator.recording .rec-dot {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
      animation: pulseRec 1s infinite;
    }

    .rec-indicator.recording { color: var(--danger); }

    @keyframes pulseRec {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    .sync-score-wrap {
      display: flex;
      align-items: baseline;
      gap: 0.2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .sync-score-num {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--success);
    }

    .heard-text {
      font-size: 0.82rem;
      color: #cbd5e1;
      background: rgba(255,255,255,0.03);
      padding: 0.45rem 0.65rem;
      border-radius: 0.5rem;
      min-height: 2.2rem;
      line-height: 1.4;
      word-break: keep-all;
    }

    /* 조작 버튼 */
    .controls {
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.65rem 0.95rem;
      border-radius: 0.6rem;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    button:active { transform: scale(0.96); }
    button.btn-primary { background: var(--primary); border-color: var(--primary); }
    button.btn-record { background: #991b1b; border-color: #ef4444; color: #fff; }
    button.btn-record.recording { background: #dc2626; animation: pulseRec 1.2s infinite; }

    .settings-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.6rem;
      font-size: 0.85rem;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    select {
      background: #070b14;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.3rem 0.5rem;
      border-radius: 0.4rem;
      outline: none;
      font-size: 0.85rem;
    }

    /* 50문장 목록 */
    .list-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
    }

    .list-header {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
    }

    .sentence-list {
      list-style: none;
      max-height: 300px;
      overflow-y: auto;
    }

    .sentence-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1e293b44;
      cursor: pointer;
    }

    .sentence-item:last-child { border-bottom: none; }

    .sentence-item.playing {
      background: rgba(56, 189, 248, 0.12);
      border-left: 4px solid var(--accent);
    }

    .item-ko {
      font-size: 0.85rem;
      font-weight: 700;
      color: #bae6fd;
      margin-bottom: 0.2rem;
    }

    .item-en {
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.35;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>워킹맘·직장인 1초 쉐도잉 트레이너 50</h1>
    <p>원어민 소리를 듣고 0.3초 뒤에 혀로 따라붙으며 내 발화 싱크로율을 확인하세요.</p>
  </header>

  <div class="stage-card">
    <div class="top-meta-bar">
      <div class="meta-badge" id="metaBadge">Sentence 1 / 50</div>
      <div class="part-tag" id="partTag">Part 1. 등원길</div>
    </div>

    <!-- 상황 & 한국어 입버릇 -->
    <div class="scene-box">
      <div class="scene-title" id="sceneTitle">상황: 아침 알람이 울린 순간</div>
      <div class="scene-ko" id="sceneKo">"아, 5분만 더 자고 싶다."</div>
    </div>

    <!-- 쉐도잉 타깃 영문 -->
    <div class="shadow-target-box" id="shadowBox">
      <div class="shadow-step-cue" id="stepCue">준비 (READY)</div>
      <div class="target-en" id="targetEn">Just give me five more minutes.</div>
    </div>

    <!-- 싱크로율 분석기 -->
    <div class="sync-board">
      <div class="sync-top">
        <div class="rec-indicator" id="recIndicator">
          <div class="rec-dot"></div>
          <span id="recStatusText">마이크 대기 중</span>
        </div>
        <div class="sync-score-wrap">
          음성 싱크로율: <span class="sync-score-num" id="syncScoreNum">--%</span>
        </div>
      </div>
      <div class="heard-text" id="heardText">🎙️ '녹음 & 싱크 분석' 버튼을 누르고 문장을 소리 내어 읽어보세요.</div>
    </div>
  </div>

  <div class="controls">
    <button id="prevBtn">⏮ 이전</button>
    <button class="btn-primary" id="playNativeBtn">▶ 원어민 쉐도잉 듣기</button>
    <button class="btn-record" id="recordSyncBtn">🔴 녹음 & 싱크 분석</button>
    <button id="nextBtn">다음 ⏭</button>
    <button id="randomBtn">🔀 랜덤: OFF</button>
  </div>

  <div class="settings-bar">
    <div class="setting-item">
      <label for="speedSelect">원어민 속도:</label>
      <select id="speedSelect">
        <option value="0.85">0.85x (입풀기)</option>
        <option value="0.95" selected>1.0x (표준)</option>
        <option value="1.1">1.1x (실전 고속)</option>
      </select>
    </div>
    <div class="setting-item">
      <label for="intervalSelect">문장 대기 시간:</label>
      <select id="intervalSelect">
        <option value="800">0.8초 (스피드)</option>
        <option value="1400" selected>1.4초 (표준)</option>
        <option value="2000">2.0초 (여유)</option>
      </select>
    </div>
  </div>

  <div class="list-card">
    <div class="list-header">
      <span>50문장 전체 목록</span>
      <span>터치 시 해당 번호 즉시 이동</span>
    </div>
    <ul class="sentence-list" id="sentenceList"></ul>
  </div>
</div>

    { id: 38, part: "Part 3. 하원 저녁", title: "잠옷 갈아입히기", ko: "로션 촉촉하게 바르고 잠옷 갈아입자.", en: "Let's put on some lotion and get into your pajamas." },

    // Part 4. 육아 퇴근 & 힐링 (39 ~ 50)
    { id: 39, part: "Part 4. 육퇴 힐링", title: "동화책 읽어줄 때", ko: "오늘 밤엔 딱 두 권만 읽고 자는 거야.", en: "We're only reading two books tonight, deal?" },
    { id: 40, part: "Part 4. 육퇴 힐링", title: "잠투정할 때", ko: "이제 불 끄자, 눈 감고 코 자야지.", en: "Lights out now, close your eyes and go to sleep." },
    { id: 41, part: "Part 4. 육퇴 힐링", title: "아이 잠든 순간", ko: "드디어 잠들었네... 육아 퇴근이다!", en: "She's finally asleep... Mom is officially off duty!" },
    { id: 42, part: "Part 4. 육퇴 힐링", title: "거실 정리하다가", ko: "장난감 밟았더니 발바닥 아파 죽겠네.", en: "Ouch, stepping on a toy hurts like crazy." },
    { id: 43, part: "Part 4. 육퇴 힐링", title: "세탁기 다 돌아갔을 때", ko: "빨래 널고 자야 내일 입지.", en: "I need to hang the laundry before going to bed." },
    { id: 44, part: "Part 4. 육퇴 힐링", title: "내일 입을 옷 챙길 때", ko: "내일 입을 옷 미리 꺼내놔야 아침에 안 바빠.", en: "I'll lay out tomorrow's clothes so we don't rush." },
    { id: 45, part: "Part 4. 육퇴 힐링", title: "주방 마감", ko: "오늘 주방 마감! 주방 불 끈다.", en: "Kitchen is officially closed for the night." },
    { id: 46, part: "Part 4. 육퇴 힐링", title: "소파에 털썩 눕는 순간", ko: "아, 드디어 온전히 내 시간이다.", en: "Ah, finally some time all to myself." },
    { id: 47, part: "Part 4. 육퇴 힐링", title: "누워서 폰 볼 때", ko: "누워서 폰 하는 이 시간이 제일 행복해.", en: "Scrolling through my phone in bed is the best part of the day." },
    { id: 48, part: "Part 4. 육퇴 힐링", title: "내일 알람 맞추며", ko: "내일 아침에도 6시 반에 일어나야 하네.", en: "Gotta wake up at 6:30 again tomorrow morning." },
    { id: 49, part: "Part 4. 육퇴 힐링", title: "남편과 나누는 위로", ko: "오늘 하루도 진짜 고생 많았어.", en: "We both worked so hard today, good job." },
    { id: 50, part: "Part 4. 육퇴 힐링", title: "불 끄고 누울 때", ko: "내일도 파이팅하자, 굿나잇!", en: "Let's do our best tomorrow too, good night!" }
  ];

  let playlist = [...rawBank];
  let currentIndex = 0;
  let isPlaying = false;
  let isRandom = false;
  let isRecording = false;
  let synth = window.speechSynthesis;
  let voices = [];
  let isUnlocked = false;

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = "en-US";
  }

  const playNativeBtn = document.getElementById("playNativeBtn");
  const recordSyncBtn = document.getElementById("recordSyncBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const randomBtn = document.getElementById("randomBtn");
  const metaBadge = document.getElementById("metaBadge");
  const partTag = document.getElementById("partTag");
  const sceneTitle = document.getElementById("sceneTitle");
  const sceneKo = document.getElementById("sceneKo");
  const shadowBox = document.getElementById("shadowBox");
  const stepCue = document.getElementById("stepCue");
  const targetEn = document.getElementById("targetEn");
  const recIndicator = document.getElementById("recIndicator");
  const recStatusText = document.getElementById("recStatusText");
  const syncScoreNum = document.getElementById("syncScoreNum");
  const heardText = document.getElementById("heardText");
  const sentenceList = document.getElementById("sentenceList");
  const speedSelect = document.getElementById("speedSelect");
  const intervalSelect = document.getElementById("intervalSelect");

  function initVoices() { voices = synth.getVoices() || []; }
  initVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = initVoices;
  }

  function getEnVoice() {
    if (!voices || voices.length === 0) voices = synth.getVoices() || [];
    return voices.find(v => v.lang && (v.lang.includes("en-US") || v.lang.includes("en_US"))) || voices.find(v => v.lang && v.lang.startsWith("en"));
  }

  function unlockAudio() {
    if (isUnlocked) return;
    try {
      const dummy = new SpeechSynthesisUtterance(" ");
      dummy.volume = 0.01;
      synth.speak(dummy);
      isUnlocked = true;
    } catch(e){}
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function calculateSimilarity(str1, str2) {
    const s1 = str1.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim();
    const s2 = str2.toLowerCase().replace(/[^a-z0-9 ]/g, "").trim();
    if (s1 === s2) return 100;
    if (s1.length === 0 || s2.length === 0) return 0;

    const matrix = [];
    for (let i = 0; i <= s2.length; i++) matrix[i] = [i];
    for (let j = 0; j <= s1.length; j++) matrix[0][j] = j;

    for (let i = 1; i <= s2.length; i++) {
      for (let j = 1; j <= s1.length; j++) {
        if (s2.charAt(i - 1) === s1.charAt(j - 1)) {
          matrix[i][j] = matrix[i - 1][j - 1];
        } else {
          matrix[i][j] = Math.min(
            matrix[i - 1][j - 1] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j] + 1
          );
        }
      }
    }
    const distance = matrix[s2.length][s1.length];
    const maxLen = Math.max(s1.length, s2.length);
    const score = Math.round(((maxLen - distance) / maxLen) * 100);
    return Math.max(0, score);
  }

  function renderList() {
    sentenceList.innerHTML = "";
    rawBank.forEach((item) => {
      const li = document.createElement("li");
      li.className = "sentence-item";
      li.id = `item-${item.id}`;
      li.innerHTML = `
        <div class="item-ko">${item.id}. ${item.ko}</div>
        <div class="item-en">${item.en}</div>
      `;
      li.addEventListener("click", () => {
        unlockAudio();
        stopPlayback();
        const found = playlist.findIndex(p => p.id === item.id);
        currentIndex = found !== -1 ? found : 0;
        updateUI();
      });
      sentenceList.appendChild(li);
    });
  }

  function updateUI() {
    const curr = playlist[currentIndex];
    document.querySelectorAll(".sentence-item").forEach(el => el.classList.remove("playing"));
    const activeLi = document.getElementById(`item-${curr.id}`);
    if (activeLi) {
      activeLi.classList.add("playing");
      activeLi.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    metaBadge.innerText = `Sentence ${currentIndex + 1} / ${playlist.length}`;
    partTag.innerText = curr.part;
    sceneTitle.innerText = `상황: ${curr.title}`;
    sceneKo.innerText = `"${curr.ko}"`;
    targetEn.innerText = curr.en;
    stepCue.innerText = "준비 (READY)";

    shadowBox.classList.remove("active");
    syncScoreNum.innerText = "--%";
    syncScoreNum.style.color = "var(--success)";
    heardText.innerText = "🎙️ '녹음 & 싱크 분석' 버튼을 누르고 문장을 소리 내어 읽어보세요.";
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function speakText(text, rate = 1.0) {
    return new Promise((resolve) => {
      if (!isPlaying) return resolve();
      synth.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = "en-US";
      utter.rate = rate;

      const voice = getEnVoice();
      if (voice) utter.voice = voice;

      let isDone = false;
      function finish() {
        if (!isDone) {
          isDone = true;
          clearTimeout(timeout);
          resolve();
        }
      }

      utter.onend = finish;
      utter.onerror = finish;

      const dur = (text.length / 5) * 1000 * (1 / rate) + 3600;
      const timeout = setTimeout(finish, dur);

      try {
        synth.speak(utter);
      } catch(e) {
        finish();
      }
    });
  }

  async function playShadowingCycle() {
    unlockAudio();
    if (isPlaying) {
      stopPlayback();
      return;
    }
    isPlaying = true;
    playNativeBtn.innerText = "⏸ 멈춤";

    const curr = playlist[currentIndex];
    const spd = parseFloat(speedSelect.value);
    const delay = parseInt(intervalSelect.value);

    // 1단계: 청취 모드
    shadowBox.classList.remove("active");
    stepCue.innerText = "👂 1. 먼저 원어민 소리를 들으세요";
    await speakText(curr.en, spd);

    if (!isPlaying) return;
    await sleep(400);

    // 2단계: 0.3초 딜레이 쉐도잉 큐
    stepCue.innerText = "🎙️ 2. 따라붙으세요! (SHADOWING NOW)";
    shadowBox.classList.add("active");
    await speakText(curr.en, Math.max(0.75, spd * 0.95));

    await sleep(delay);
    stopPlayback();
  }

  function stopPlayback() {
    isPlaying = false;
    synth.cancel();
    playNativeBtn.innerText = "▶ 원어민 쉐도잉 듣기";
    shadowBox.classList.remove("active");
    stepCue.innerText = "준비 (READY)";
  }

  // 발음 녹음 & 싱크로율 판정
  function startRecordingSync() {
    if (!recognition) {
      alert("현재 브라우저는 Web Speech API 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저를 이용해 주세요.");
      return;
    }

    if (isRecording) {
      recognition.stop();
      return;
    }

    stopPlayback();
    isRecording = true;
    recordSyncBtn.classList.add("recording");
    recordSyncBtn.innerText = "⏹ 녹음 완료 (분석 중...)";
    recIndicator.classList.add("recording");
    recStatusText.innerText = "음성 청취 중... (지금 발화하세요)";
    heardText.innerText = "듣고 있습니다... 발화가 끝나면 마이크가 자동으로 꺼집니다.";
    syncScoreNum.innerText = "...";

    recognition.start();

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      heardText.innerText = `🗣️ 인식된 발화: "${transcript}"`;

      const curr = playlist[currentIndex];
      const score = calculateSimilarity(transcript, curr.en);

      syncScoreNum.innerText = `${score}%`;
      if (score >= 80) {
        syncScoreNum.style.color = "var(--success)";
      } else if (score >= 50) {
        syncScoreNum.style.color = "var(--cue)";
      } else {
        syncScoreNum.style.color = "var(--danger)";
      }
    };

    recognition.onerror = (event) => {
      recStatusText.innerText = "인식 오류 (" + event.error + ")";
      heardText.innerText = "마이크 입력을 확인하지 못했습니다. 다시 시도해 주세요.";
    };

    recognition.onend = () => {
      isRecording = false;
      recordSyncBtn.classList.remove("recording");
      recordSyncBtn.innerText = "🔴 녹음 & 싱크 분석";
      recIndicator.classList.remove("recording");
      recStatusText.innerText = "분석 완료";
    };
  }

  playNativeBtn.addEventListener("click", playShadowingCycle);
  recordSyncBtn.addEventListener("click", startRecordingSync);

  prevBtn.addEventListener("click", () => {
    stopPlayback();
    if (currentIndex > 0) currentIndex--;
    updateUI();
  });

  nextBtn.addEventListener("click", () => {
    stopPlayback();
    if (currentIndex < playlist.length - 1) currentIndex++;
    updateUI();
  });

  randomBtn.addEventListener("click", () => {
    isRandom = !isRandom;
    randomBtn.innerText = isRandom ? "🔀 랜덤: ON" : "🔀 랜덤: OFF";
    randomBtn.style.color = isRandom ? "var(--accent)" : "#fff";
    playlist = isRandom ? shuffle(rawBank) : [...rawBank];
    currentIndex = 0;
    updateUI();
  });

  renderList();
  updateUI();
</script>
