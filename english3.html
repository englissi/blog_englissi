<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>'I think' 탈출 원어민식 논리 트레이너 </title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --warning: #f87171;
      --success: #34d399;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem 0.75rem 2rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    header {
      text-align: center;
      padding: 0.5rem 0;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.3rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .display-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2rem 1rem 1.5rem;
      text-align: center;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .step-badge {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: #334155;
      color: var(--accent);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .speaking-status {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .speaking .dot {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .current-ko {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      transition: color 0.2s;
      line-height: 1.4;
      word-break: keep-all;
    }

    .current-ko.active {
      color: #fff;
      font-weight: 700;
    }

    .compare-box {
      width: 100%;
      margin-bottom: 0.75rem;
      padding: 0.4rem 0.6rem;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 0.5rem;
      border: 1px dashed var(--border);
    }

    .bad-expression {
      color: var(--warning);
      font-size: 0.85rem;
      text-decoration: line-through;
      opacity: 0.85;
      word-break: keep-all;
    }

    .current-en {
      font-size: 1.3rem;
      font-weight: 700;
      color: #64748b;
      line-height: 1.35;
      transition: color 0.2s;
      word-break: keep-all;
    }

    .current-en.active {
      color: var(--accent);
    }

    .repeat-counter {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--success);
      font-weight: 600;
      min-height: 1.2rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.65rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
    }

    button:active {
      transform: scale(0.98);
      background: #334155;
    }

    button.btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .settings-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.85rem;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.3rem 0.5rem;
      border-radius: 0.4rem;
      outline: none;
      font-size: 0.85rem;
    }

    .list-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
    }

    .list-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
    }

    .sentence-list {
      list-style: none;
      max-height: 380px;
      overflow-y: auto;
    }

    .sentence-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #33415544;
      cursor: pointer;
    }

    .sentence-item:last-child {
      border-bottom: none;
    }

    .sentence-item.playing {
      background: #0284c718;
      border-left: 4px solid var(--primary);
    }

    .item-ko {
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
      color: #cbd5e1;
    }

    .item-bad {
      font-size: 0.8rem;
      color: #f87171aa;
      text-decoration: line-through;
      margin-bottom: 0.2rem;
    }

    .item-en {
      font-size: 0.95rem;
      font-weight: 600;
      color: #93c5fd;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>'I think' 탈출 원어민식 논리 트레이너</h1>
    <p>아래 [▶ 전체 재생] 버튼을 터치하면 오디오가 활성화됩니다.</p>
  </header>

  <div class="display-card" id="displayCard">
    <div class="step-badge" id="stepBadge">대기 중</div>
    <div class="speaking-status" id="speakingStatus">
      <div class="dot"></div>
      <span id="statusText">정지</span>
    </div>

    <div class="current-ko" id="currentKo">재생 버튼을 터치해 연습을 시작하세요.</div>
    <div class="compare-box">
      <div class="bad-expression" id="currentBad">기존: I think... (초보식 화법 대체)</div>
    </div>
    <div class="current-en" id="currentEn">Tap Play to Start</div>
    <div class="repeat-counter" id="repeatCounter"></div>
  </div>

  <div class="controls">
    <button id="prevBtn">⏮ 이전</button>
    <button class="btn-primary" id="playPauseBtn">▶ 전체 재생</button>
    <button id="nextBtn">다음 ⏭</button>
    <button id="stopBtn">⏹ 정지</button>
  </div>

  <div class="settings-panel">
    <div class="setting-item">
      <label for="speedSelect">영어 낭독 속도:</label>
      <select id="speedSelect">
        <option value="0.85">0.85x</option>
        <option value="0.95" selected>1.0x (표준)</option>
        <option value="1.1">1.1x</option>
      </select>
    </div>
    <div class="setting-item">
      <label for="intervalSelect">문장 간 대기:</label>
      <select id="intervalSelect">
        <option value="600">0.6초</option>
        <option value="1200" selected>1.2초 (표준)</option>
        <option value="2000">2.0초 (따라하기)</option>
      </select>
    </div>
  </div>

  <div class="list-card">
    <div class="list-header">
      <span>'I think' 탈출 50개 문장</span>
      <span>터치 시 해당 번호 이동</span>
    </div>
    <ul class="sentence-list" id="sentenceList"></ul>
  </div>
</div>

<script>
  const sentences = [
    { ko: "그 방법이 시간 아껴줄 것 같아.", bad: "I think this method saves time.", en: "This method will save us a lot of time." },
    { ko: "가격이 좀 비싼 것 같아요.", bad: "I think the price is too high.", en: "The price seems a bit steep." },
    { ko: "오늘 안에 이거 끝낼 수 있을 것 같아.", bad: "I think I can finish this today.", en: "I'm confident I can finish this today." },
    { ko: "그 사람이 우리 제안 별로 안 좋아하는 듯해.", bad: "I think he doesn't like our offer.", en: "The reaction suggests he isn't fully on board." },
    { ko: "회의 일정 좀 조정해야 할 것 같아요.", bad: "I think we should reschedule.", en: "A schedule change would work better for everyone." },
    { ko: "걔네 지금 뭔가 오해하고 있는 것 같아.", bad: "I think they misunderstand.", en: "There seems to be a misunderstanding here." },
    { ko: "새 디자인이 훨씬 깔끔한 것 같아.", bad: "I think the new design is cleaner.", en: "The new design looks much sharper." },
    { ko: "마케팅 방향을 바꿔야 할 것 같아요.", bad: "I think we need to change marketing.", en: "The numbers show we need a new approach." },
    { ko: "그 프로젝트 완전 성공적이었던 것 같아.", bad: "I think that project was successful.", en: "The results prove the project was a huge success." },
    { ko: "지금 결정하기엔 정보가 부족한 것 같아.", bad: "I think we don't have enough info.", en: "We lack the data to make a final call right now." },
    { ko: "커피 마시면 잠이 깰 것 같아.", bad: "I think coffee will wake me up.", en: "A cup of coffee will definitely help me wake up." },
    { ko: "내일 비 올 것 같은데.", bad: "I think it will rain tomorrow.", en: "The forecast calls for rain tomorrow." },
    { ko: "그 옷 너한테 진짜 잘 어울리는 것 같아.", bad: "I think that shirt looks good on you.", en: "That shirt really suits you." },
    { ko: "그거 생각보다 오래 걸릴 것 같은데?", bad: "I think it takes longer.", en: "It's going to take longer than expected." },
    { ko: "이 약 먹으면 두통 가라앉을 거야.", bad: "I think this medicine helps headache.", en: "This medicine will relieve your headache quickly." },
    { ko: "걔 오늘 기분 안 좋아 보이는 것 같아.", bad: "I think she is in a bad mood.", en: "She seems upset about something today." },
    { ko: "이 길이가 지름길인 것 같아.", bad: "I think this way is a shortcut.", en: "This route is definitely faster." },
    { ko: "그 사람 약속 잊어버린 것 같은데.", bad: "I think he forgot the meeting.", en: "It looks like he forgot our appointment." },
    { ko: "이 컴퓨터 고장 난 것 같아요.", bad: "I think this PC is broken.", en: "This computer isn't working properly." },
    { ko: "네 말이 맞는 것 같아.", bad: "I think you are right.", en: "Your point makes complete sense." },
    { ko: "지하철 타는 게 더 빠를 것 같아.", bad: "I think the subway is faster.", en: "Taking the subway will save us time." },
    { ko: "음식에 소금이 좀 더 들어가야 할 것 같아.", bad: "I think it needs more salt.", en: "A pinch of salt would bring out the flavor." },
    { ko: "우리 예산이 좀 모자란 것 같아요.", bad: "I think our budget is small.", en: "Our budget falls short of the estimate." },
    { ko: "분위기가 너무 무거운 것 같아.", bad: "I think the mood is heavy.", en: "The atmosphere feels a bit tense." },
    { ko: "그 영화 볼 만한 가치가 있는 것 같아.", bad: "I think that movie is worth watching.", en: "The movie is definitely worth your time." },
    { ko: "배터리 수명이 다 된 것 같아.", bad: "I think the battery is dead.", en: "The battery has completely run out." },
    { ko: "직원을 한 명 더 뽑아야 할 것 같아요.", bad: "I think we need more staff.", en: "Our current workload requires an extra hand." },
    { ko: "규칙을 좀 더 단순하게 만들어야 할 것 같아.", bad: "I think the rule should be simple.", en: "Simpler rules will improve efficiency." },
    { ko: "걔네 둘이 싸운 것 같은 분위기야.", bad: "I think they had a fight.", en: "There is obvious tension between those two." },
    { ko: "소음 때문에 일에 집중이 안 되는 것 같아.", bad: "I think the noise disturbs me.", en: "The noise is disrupting my focus." },
    { ko: "이 식당 음식 진짜 괜찮은 것 같아.", bad: "I think this food is great.", en: "The food here never disappoints." },
    { ko: "배송이 좀 지연될 것 같아요.", bad: "I think the delivery will be late.", en: "The tracking updates indicate a delivery delay." },
    { ko: "그 계획에 허점이 좀 있는 것 같아.", bad: "I think the plan has flaws.", en: "The plan overlooks a few critical risks." },
    { ko: "운동화 새로 사야 할 것 같아.", bad: "I think I need new shoes.", en: "These running shoes are completely worn out." },
    { ko: "오늘 날씨가 산책하기 딱 좋은 것 같아.", bad: "I think the weather is good for walk.", en: "The clear weather makes it perfect for a walk." },
    { ko: "걔가 일부러 연락 안 받는 것 같아.", bad: "I think she ignores me on purpose.", en: "She appears to be deliberately avoiding my calls." },
    { ko: "조명을 좀 더 밝게 해야 할 것 같아요.", bad: "I think the light should be bright.", en: "Brighter lighting would improve visibility here." },
    { ko: "이 가방 들고 다니기 너무 무거운 것 같아.", bad: "I think this bag is too heavy.", en: "This bag puts too much strain on my shoulder." },
    { ko: "회사가 올바른 방향으로 가고 있는 것 같아.", bad: "I think the company is on right track.", en: "Recent milestones confirm we are on the right track." },
    { ko: "그 방 에어컨이 고장 난 것 같아요.", bad: "I think the AC is broken in that room.", en: "The room is overheating despite the AC being on." },
    { ko: "차라리 내일 아침에 다시 얘기하는 게 나을 것 같아.", bad: "I think talking tomorrow is better.", en: "Revisiting this tomorrow morning would be more productive." },
    { ko: "고객들이 새 기능을 헷갈려 하는 것 같아요.", bad: "I think users are confused.", en: "User feedback indicates confusion around the new feature." },
    { ko: "휴식이 좀 필요한 상태인 것 같아.", bad: "I think I need a break.", en: "A short break would definitely restore my energy." },
    { ko: "비밀번호를 잘못 입력한 것 같아.", bad: "I think I typed the wrong password.", en: "The system is rejecting this password." },
    { ko: "이 색상이 우리 브랜드에 더 잘 어울리는 것 같아.", bad: "I think this color matches our brand.", en: "This color aligns perfectly with our brand tone." },
    { ko: "설명서가 너무 복잡하게 쓰여 있는 것 같아.", bad: "I think the manual is too complex.", en: "The manual makes the steps overly complicated." },
    { ko: "그 문제에 다른 해결책이 있는 것 같아.", bad: "I think there is another way.", en: "An alternative approach could solve this issue faster." },
    { ko: "이번 세일 때 매출이 많이 뛸 것 같아.", bad: "I think sales will increase.", en: "The promotion is projected to boost total sales." },
    { ko: "와이파이 연결이 좀 불안정한 것 같아요.", bad: "I think the Wi-Fi is unstable.", en: "The weak Wi-Fi signal keeps interrupting the connection." },
    { ko: "이제 모든 게 다 제자리를 찾은 것 같아.", bad: "I think everything is okay now.", en: "Everything finally fell into place." }
  ];

  let currentIndex = 0;
  let isRunning = false;
  let synth = window.speechSynthesis;
  let voices = [];
  let isUnlocked = false;

  const playPauseBtn = document.getElementById("playPauseBtn");
  const stopBtn = document.getElementById("stopBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const currentKo = document.getElementById("currentKo");
  const currentBad = document.getElementById("currentBad");
  const currentEn = document.getElementById("currentEn");
  const repeatCounter = document.getElementById("repeatCounter");
  const stepBadge = document.getElementById("stepBadge");
  const speakingStatus = document.getElementById("speakingStatus");
  const statusText = document.getElementById("statusText");
  const sentenceList = document.getElementById("sentenceList");
  const speedSelect = document.getElementById("speedSelect");
  const intervalSelect = document.getElementById("intervalSelect");

  function initVoices() {
    voices = synth.getVoices() || [];
  }
  initVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = initVoices;
  }

  // 모바일 오디오 엔진 언락
  function unlockMobileAudio() {
    if (isUnlocked) return;
    try {
      const dummy = new SpeechSynthesisUtterance(" ");
      dummy.volume = 0.01;
      dummy.rate = 2.0;
      synth.speak(dummy);
      isUnlocked = true;
    } catch (e) {
      console.warn("Audio unlock failed", e);
    }
  }

  sentences.forEach((item, idx) => {
    const li = document.createElement("li");
    li.className = "sentence-item";
    li.id = `item-${idx}`;
    li.innerHTML = `
      <div class="item-ko">${idx + 1}. ${item.ko}</div>
      <div class="item-bad">${item.bad}</div>
      <div class="item-en">${item.en}</div>
    `;
    li.addEventListener("click", () => {
      unlockMobileAudio();
      stopPlayback();
      currentIndex = idx;
      updateUI();
      startCycle();
    });
    sentenceList.appendChild(li);
  });

  function updateUI() {
    document.querySelectorAll(".sentence-item").forEach((el, i) => {
      const isSelected = i === currentIndex;
      el.classList.toggle("playing", isSelected);
      if (isSelected) {
        el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    });
    const curr = sentences[currentIndex];
    currentKo.innerText = curr.ko;
    currentBad.innerText = `피해야 할 표현: ${curr.bad}`;
    currentEn.innerText = curr.en;
    stepBadge.innerText = `문장 ${currentIndex + 1} / ${sentences.length}`;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // 모바일 안전 타이머 장착 TTS 함수
  function speakTextMobile(text, lang, rate = 1.0) {
    return new Promise((resolve) => {
      if (!isRunning) return resolve();

      synth.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = rate;

      if (!voices || voices.length === 0) {
        voices = synth.getVoices() || [];
      }

      if (voices.length > 0) {
        if (lang.startsWith("ko")) {
          const koVoice = voices.find(v => v.lang && (v.lang.includes("ko") || v.lang.includes("KR")));
          if (koVoice) utter.voice = koVoice;
        } else {
          const enVoice = voices.find(v => v.lang && (v.lang.includes("en-US") || v.lang.includes("en_US"))) || voices.find(v => v.lang && v.lang.startsWith("en"));
          if (enVoice) utter.voice = enVoice;
        }
      }

      let isDone = false;
      function finish() {
        if (!isDone) {
          isDone = true;
          clearTimeout(safetyTimeout);
          resolve();
        }
      }

      utter.onend = finish;
      utter.onerror = finish;

      const expectedDuration = (text.length / 5) * 1000 * (1 / rate) + 3500;
      const safetyTimeout = setTimeout(() => {
        finish();
      }, expectedDuration);

      try {
        synth.speak(utter);
      } catch (e) {
        finish();
      }
    });
  }

  async function playSentenceCycle(index) {
    if (!isRunning) return;
    const item = sentences[index];
    const enSpeed = parseFloat(speedSelect.value);
    const delay = parseInt(intervalSelect.value);

    // 1. 한국어
    currentKo.classList.add("active");
    currentEn.classList.remove("active");
    repeatCounter.innerText = "🗣 [1/3] 한국어 제시";
    statusText.innerText = "한국어";
    speakingStatus.classList.add("speaking");

    await speakTextMobile(item.ko, "ko-KR", 1.0);
    currentKo.classList.remove("active");
    await sleep(350);

    if (!isRunning) return;

    // 2. 영어 1회차
    currentEn.classList.add("active");
    repeatCounter.innerText = "🇺🇸 [2/3] 원어민식 논리 1회";
    statusText.innerText = "영어 1회";
    await speakTextMobile(item.en, "en-US", enSpeed);
    await sleep(delay);

    if (!isRunning) return;

    // 3. 영어 2회차 (따라하기)
    repeatCounter.innerText = "🔁 [3/3] 영어 2회 (따라 말하기)";
    statusText.innerText = "영어 2회";
    await speakTextMobile(item.en, "en-US", Math.max(0.75, enSpeed * 0.92));
    currentEn.classList.remove("active");
    speakingStatus.classList.remove("speaking");
    statusText.innerText = "대기";
    repeatCounter.innerText = "";
    await sleep(delay);
  }

  async function startCycle() {
    unlockMobileAudio();
    isRunning = true;
    playPauseBtn.innerText = "⏸ 일시정지";
    playPauseBtn.classList.remove("btn-primary");

    while (isRunning && currentIndex < sentences.length) {
      updateUI();
      await playSentenceCycle(currentIndex);
      if (!isRunning) break;
      if (currentIndex < sentences.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
        break;
      }
    }

    if (currentIndex === 0 && !isRunning) {
      stopPlayback();
    }
  }

  function stopPlayback() {
    isRunning = false;
    synth.cancel();
    playPauseBtn.innerText = "▶ 전체 재생";
    playPauseBtn.classList.add("btn-primary");
    speakingStatus.classList.remove("speaking");
    statusText.innerText = "정지";
    repeatCounter.innerText = "";
    currentKo.classList.remove("active");
    currentEn.classList.remove("active");
  }

  playPauseBtn.addEventListener("click", () => {
    if (isRunning) {
      stopPlayback();
    } else {
      startCycle();
    }
  });

  stopBtn.addEventListener("click", () => {
    stopPlayback();
    currentIndex = 0;
    updateUI();
  });

  prevBtn.addEventListener("click", () => {
    const wasRunning = isRunning;
    stopPlayback();
    if (currentIndex > 0) currentIndex--;
    updateUI();
    if (wasRunning) startCycle();
  });

  nextBtn.addEventListener("click", () => {
    const wasRunning = isRunning;
    stopPlayback();
    if (currentIndex < sentences.length - 1) currentIndex++;
    updateUI();
    if (wasRunning) startCycle();
  });

  updateUI();
</script>

</body>
</html>
