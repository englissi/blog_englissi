<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>동시 낭독(Simultaneous Reading) 100 마스터</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --primary: #6366f1;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #1e293b;
      --danger: #f43f5e;
      --success: #34d399;
      --count-cue: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 0.8rem 0.75rem 2.5rem;
    }

    .container {
      width: 100%;
      max-width: 660px;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    header {
      text-align: center;
      padding: 0.3rem 0;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 0.2rem;
    }

    header p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    /* 동시 낭독 스테이지 */
    .stage-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.6rem 1.1rem 1.4rem;
      text-align: center;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    .meta-badge {
      position: absolute;
      top: 0.8rem;
      left: 0.8rem;
      background: #1e293b;
      color: var(--accent);
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .part-tag {
      position: absolute;
      top: 0.8rem;
      right: 0.8rem;
      font-size: 0.72rem;
      color: #a5b4fc;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-weight: 600;
    }

    /* 3-2-1 발화 카운트다운 큐 */
    .countdown-display {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--count-cue);
      min-height: 2.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
      transition: transform 0.1s;
    }
    .countdown-display.active {
      transform: scale(1.15);
      text-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
    }

    .target-ko {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 0.8rem;
      word-break: keep-all;
      line-height: 1.4;
    }

    /* 동시 낭독 타깃 영문 (강조 애니메이션) */
    .target-en {
      font-size: 1.35rem;
      font-weight: 800;
      color: #94a3b8;
      line-height: 1.45;
      word-break: keep-all;
      min-height: 4.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      padding: 0.4rem 0.6rem;
      border-radius: 0.75rem;
    }

    .target-en.simul-active {
      color: #fff;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: scale(1.02);
    }

    /* 호흡 & 연음 포인트 가이드 */
    .rhythm-guide {
      margin-top: 0.8rem;
      font-size: 0.82rem;
      color: var(--accent);
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed #334155;
      padding: 0.35rem 0.8rem;
      border-radius: 0.5rem;
      min-height: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 하단 조작 패널 */
    .controls {
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.65rem 0.95rem;
      border-radius: 0.6rem;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    button:active {
      transform: scale(0.96);
    }

    button.btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .settings-bar {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.6rem;
      font-size: 0.85rem;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    select {
      background: #070b14;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.3rem 0.5rem;
      border-radius: 0.4rem;
      outline: none;
      font-size: 0.85rem;
    }

    /* 100문장 리스트 */
    .list-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
    }

    .list-header {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      color: var(--muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
    }

    .sentence-list {
      list-style: none;
      max-height: 350px;
      overflow-y: auto;
    }

    .sentence-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #1e293b44;
      cursor: pointer;
    }

    .sentence-item:last-child {
      border-bottom: none;
    }

    .sentence-item.playing {
      background: rgba(56, 189, 248, 0.12);
      border-left: 4px solid var(--accent);
    }

    .item-ko {
      font-size: 0.82rem;
      color: #cbd5e1;
      margin-bottom: 0.2rem;
    }

    .item-en {
      font-size: 0.95rem;
      font-weight: 700;
      color: #bae6fd;
      margin-bottom: 0.2rem;
    }

    .item-rhythm {
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>동시 낭독(Simultaneous Reading) 100</h1>
    <p>3-2-1 큐에 맞춰 원어민 목소리 위로 내 목소리를 0.1초 차이 없이 포개세요.</p>
  </header>

  <div class="stage-card" id="stageCard">
    <div class="meta-badge" id="metaBadge">Sentence 1 / 100</div>
    <div class="part-tag" id="partTag">Part 1. 돌발 상황</div>

    <!-- 3-2-1 카운트다운 알림창 -->
    <div class="countdown-display" id="countdownDisplay">준비 (Ready)</div>

    <div class="target-ko" id="targetKo">재생 버튼을 터치해 동시 낭독을 시작하세요.</div>
    <div class="target-en" id="targetEn">Simultaneous Reading Ready</div>
    <div class="rhythm-guide" id="rhythmGuide">💡 호흡 및 연음 가이드가 여기에 표시됩니다.</div>
  </div>

  <div class="controls">
    <button id="prevBtn">⏮ 이전</button>
    <button class="btn-primary" id="playPauseBtn">▶ 100문장 동시 낭독 시작</button>
    <button id="nextBtn">다음 ⏭</button>
    <button id="stopBtn">⏹ 정지</button>
    <button id="randomBtn">🔀 랜덤: OFF</button>
  </div>

  <div class="settings-bar">
    <div class="setting-item">
      <label for="speedSelect">원어민 속도:</label>
      <select id="speedSelect">
        <option value="0.85">0.85x (입풀기)</option>
        <option value="0.95" selected>1.0x (표준 동기화)</option>
        <option value="1.1">1.1x (실전 고속)</option>
      </select>
    </div>
    <div class="setting-item">
      <label for="intervalSelect">문장 대기 시간:</label>
      <select id="intervalSelect">
        <option value="1200">1.2초 (빠른 호흡)</option>
        <option value="1800" selected>1.8초 (숨고르기)</option>
        <option value="2500">2.5초 (여유)</option>
      </select>
    </div>
  </div>

  <div class="list-card">
    <div class="list-header">
      <span>100문장 동시 낭독 코스</span>
      <span>터치 시 해당 문장 즉시 이동</span>
    </div>
    <ul class="sentence-list" id="sentenceList"></ul>
  </div>
</div>

<script>
  const rawData = [
    // Part 1. 일상 돌발 상황 & 긴급 반응 (01 ~ 25)
    { id: 1, part: "Part 1. 돌발 상황", ko: "회의에 늦어 뛰어 들어옴", en: "I'm so sorry I'm late. The traffic was unbelievable.", rhythm: "[late] 마침표 뚝 끊고, [un-be-LIEV-able] 강세" },
    { id: 2, part: "Part 1. 돌발 상황", ko: "갑작스러운 폭우에 젖음", en: "I got totally soaked. It started pouring out of nowhere.", rhythm: "[got totally] 부드럽게 연결, [POUR-ing] 길게" },
    { id: 3, part: "Part 1. 돌발 상황", ko: "커피 마시고 피로 회복", en: "This coffee really helps. I'm finally waking up.", rhythm: "[really helps] 툭 던지고, [waking up] 한 호흡" },

    { id: 5, part: "Part 1. 돌발 상황", ko: "무거운 가방 내려놓기", en: "This bag is killing me. Let me put it down.", rhythm: "[killing me] 스타카토, [put-it-down] 연음" },
    { id: 6, part: "Part 1. 돌발 상황", ko: "배터리 방전으로 먹통", en: "My phone completely died. The screen just went black.", rhythm: "[died]에서 숨 고르고, [went black] 하강조" },
    { id: 7, part: "Part 1. 돌발 상황", ko: "갑작스러운 약속 취소", en: "He just canceled on me. Now I have some free time.", rhythm: "[can-celed on me] 리듬, [FREE time] 경쾌하게" },
    { id: 8, part: "Part 1. 돌발 상황", ko: "식당 문 닫혀서 헛걸음", en: "The doors are locked. Looks like they're closed today.", rhythm: "[locked] 단호하게 끊기, [closed to-day] 안정감" },

    { id: 13, part: "Part 1. 돌발 상황", ko: "엘리베이터 점검 중", en: "The elevator isn't working. Let's take the stairs.", rhythm: "[isn't working] 플랫하게, [take the stairs] 리듬" },

  let playlist = [...rawData];
  let currentIndex = 0;
  let isRunning = false;
  let isRandom = false;
  let synth = window.speechSynthesis;
  let voices = [];
  let isUnlocked = false;

  const playPauseBtn = document.getElementById("playPauseBtn");
  const stopBtn = document.getElementById("stopBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const randomBtn = document.getElementById("randomBtn");
  const countdownDisplay = document.getElementById("countdownDisplay");
  const targetKo = document.getElementById("targetKo");
  const targetEn = document.getElementById("targetEn");
  const rhythmGuide = document.getElementById("rhythmGuide");
  const metaBadge = document.getElementById("metaBadge");
  const partTag = document.getElementById("partTag");
  const sentenceList = document.getElementById("sentenceList");
  const speedSelect = document.getElementById("speedSelect");
  const intervalSelect = document.getElementById("intervalSelect");

  function initVoices() {
    voices = synth.getVoices() || [];
  }
  initVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = initVoices;
  }

  function unlockAudio() {
    if (isUnlocked) return;
    try {
      const dummy = new SpeechSynthesisUtterance(" ");
      dummy.volume = 0.01;
      dummy.rate = 2.0;
      synth.speak(dummy);
      isUnlocked = true;
    } catch(e){}
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderList() {
    sentenceList.innerHTML = "";
    rawData.forEach((item) => {
      const li = document.createElement("li");
      li.className = "sentence-item";
      li.id = `item-${item.id}`;
      li.innerHTML = `
        <div class="item-ko">${item.id}. [${item.part}] ${item.ko}</div>
        <div class="item-en">${item.en}</div>
        <div class="item-rhythm">리듬: ${item.rhythm}</div>
      `;
      li.addEventListener("click", () => {
        unlockAudio();
        stopPlayback();
        const found = playlist.findIndex(p => p.id === item.id);
        currentIndex = found !== -1 ? found : 0;
        updateUI();
        startCycle();
      });
      sentenceList.appendChild(li);
    });
  }

  function updateUI() {
    const curr = playlist[currentIndex];
    document.querySelectorAll(".sentence-item").forEach(el => el.classList.remove("playing"));
    const activeLi = document.getElementById(`item-${curr.id}`);
    if (activeLi) {
      activeLi.classList.add("playing");
      activeLi.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    metaBadge.innerText = `Sentence ${currentIndex + 1} / ${playlist.length}`;
    partTag.innerText = curr.part;
    targetKo.innerText = curr.ko;
    targetEn.innerText = curr.en;
    rhythmGuide.innerText = `💡 ${curr.rhythm}`;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function speakTextMobile(text, lang, rate = 1.0) {
    return new Promise((resolve) => {
      if (!isRunning) return resolve();
      synth.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = rate;

      if (!voices || voices.length === 0) voices = synth.getVoices() || [];
      if (voices.length > 0) {
        if (lang.startsWith("ko")) {
          const koVoice = voices.find(v => v.lang && (v.lang.includes("ko") || v.lang.includes("KR")));
          if (koVoice) utter.voice = koVoice;
        } else {
          const enVoice = voices.find(v => v.lang && (v.lang.includes("en-US") || v.lang.includes("en_US"))) || voices.find(v => v.lang && v.lang.startsWith("en"));
          if (enVoice) utter.voice = enVoice;
        }
      }

      let isDone = false;
      function finish() {
        if (!isDone) {
          isDone = true;
          clearTimeout(timeout);
          resolve();
        }
      }

      utter.onend = finish;
      utter.onerror = finish;

      const dur = (text.length / 5) * 1000 * (1 / rate) + 3800;
      const timeout = setTimeout(finish, dur);

      try {
        synth.speak(utter);
      } catch(e) {
        finish();
      }
    });
  }

  async function playSimulCycle(index) {
    if (!isRunning) return;
    const item = playlist[index];
    const enSpeed = parseFloat(speedSelect.value);
    const delay = parseInt(intervalSelect.value);

    // 1. 상황 인지 (눈으로 영문 구조 스캔)
    targetEn.classList.remove("simul-active");
    countdownDisplay.className = "countdown-display";
    countdownDisplay.innerText = "👀 눈으로 문장 스캔";
    await sleep(900);
    if (!isRunning) return;

    // 2. 동시 낭독 카운트다운 큐 (3 -> 2 -> 1)
    countdownDisplay.innerText = "3";
    countdownDisplay.classList.add("active");
    await sleep(450);
    if (!isRunning) return;

    countdownDisplay.innerText = "2";
    await sleep(450);
    if (!isRunning) return;

    countdownDisplay.innerText = "1";
    await sleep(450);
    if (!isRunning) return;

    // 3. 동시 낭독 발화 (원어민 음성과 동시에 목소리 포개기)
    countdownDisplay.innerText = "🎙️ SPEAK NOW! (동시 낭독)";
    targetEn.classList.add("simul-active");

    await speakTextMobile(item.en, "en-US", enSpeed);

    targetEn.classList.remove("simul-active");
    countdownDisplay.classList.remove("active");
    countdownDisplay.innerText = "대기 (Breathe)";
    await sleep(delay);
  }

  async function startCycle() {
    unlockAudio();
    isRunning = true;
    playPauseBtn.innerText = "⏸ 일시정지";
    playPauseBtn.classList.remove("btn-primary");

    while (isRunning && currentIndex < playlist.length) {
      updateUI();
      await playSimulCycle(currentIndex);
      if (!isRunning) break;
      if (currentIndex < playlist.length - 1) {
        currentIndex++;
      } else {
        if (isRandom) playlist = shuffle(rawData);
        currentIndex = 0;
        break;
      }
    }

    if (currentIndex === 0 && !isRunning) {
      stopPlayback();
    }
  }

  function stopPlayback() {
    isRunning = false;
    synth.cancel();
    playPauseBtn.innerText = "▶ 100문장 동시 낭독 시작";
    playPauseBtn.classList.add("btn-primary");
    countdownDisplay.innerText = "정지 (Stopped)";
    countdownDisplay.classList.remove("active");
    targetEn.classList.remove("simul-active");
  }

  playPauseBtn.addEventListener("click", () => {
    if (isRunning) stopPlayback();
    else startCycle();
  });

  stopBtn.addEventListener("click", () => {
    stopPlayback();
    currentIndex = 0;
    updateUI();
  });

  prevBtn.addEventListener("click", () => {
    const wasRunning = isRunning;
    stopPlayback();
    if (currentIndex > 0) currentIndex--;
    updateUI();
    if (wasRunning) startCycle();
  });

  nextBtn.addEventListener("click", () => {
    const wasRunning = isRunning;
    stopPlayback();
    if (currentIndex < playlist.length - 1) currentIndex++;
    updateUI();
    if (wasRunning) startCycle();
  });

  randomBtn.addEventListener("click", () => {
    isRandom = !isRandom;
    randomBtn.innerText = isRandom ? "🔀 랜덤: ON" : "🔀 랜덤: OFF";
    randomBtn.style.color = isRandom ? "#38bdf8" : "#fff";
    playlist = isRandom ? shuffle(rawData) : [...rawData];
    currentIndex = 0;
    updateUI();
  });

  renderList();
  updateUI();
</script>

</body>
</html>
