<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>문장 절반 쪼개기 트레이너 (50문장)</title>
  <style>
    :root {
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #fb923c;
      --tag-bg: rgba(234, 88, 12, 0.15);
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem 0.75rem 2rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    header {
      text-align: center;
      padding: 0.5rem 0;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.3rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .display-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2rem 1rem 1.5rem;
      text-align: center;
      min-height: 270px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .step-badge {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: #334155;
      color: var(--accent);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .speaking-status {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .speaking .dot {
      background: #f97316;
      box-shadow: 0 0 8px #f97316;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .current-ko {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      transition: color 0.2s;
      line-height: 1.4;
      word-break: keep-all;
    }

    .current-ko.active {
      color: #fff;
      font-weight: 700;
    }

    .slice-step {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: var(--tag-bg);
      border: 1px solid rgba(251, 146, 60, 0.4);
      color: var(--accent);
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .current-en {
      font-size: 1.35rem;
      font-weight: 700;
      color: #64748b;
      line-height: 1.4;
      transition: color 0.2s;
      word-break: keep-all;
    }

    .current-en.active {
      color: var(--accent);
    }

    .repeat-counter {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #fbbf24;
      font-weight: 600;
      min-height: 1.2rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.65rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
    }

    button:active {
      transform: scale(0.98);
      background: #334155;
    }

    button.btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    button.btn-primary:hover {
      background: var(--primary-hover);
    }

    .settings-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.85rem;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.3rem 0.5rem;
      border-radius: 0.4rem;
      outline: none;
      font-size: 0.85rem;
    }

    .list-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
    }

    .list-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
    }

    .sentence-list {
      list-style: none;
      max-height: 380px;
      overflow-y: auto;
    }

    .sentence-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #33415544;
      cursor: pointer;
    }

    .sentence-item:last-child {
      border-bottom: none;
    }

    .sentence-item.playing {
      background: rgba(234, 88, 12, 0.12);
      border-left: 4px solid var(--primary);
    }

    .item-ko {
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
      color: #cbd5e1;
    }

    .item-step1 {
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 0.2rem;
    }

    .item-en {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fed7aa;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>문장 절반 쪼개기 트레이너 (50문장)</h1>
    <p>아래 [▶ 전체 재생] 버튼을 터치하면 오디오가 활성화됩니다.</p>
  </header>

  <div class="display-card" id="displayCard">
    <div class="step-badge" id="stepBadge">대기 중</div>
    <div class="speaking-status" id="speakingStatus">
      <div class="dot"></div>
      <span id="statusText">정지</span>
    </div>

    <div class="current-ko" id="currentKo">재생 버튼을 터치해 훈련을 시작하세요.</div>
    <div class="slice-step" id="sliceStep">1단계 핵심 결과 툭 던지기 대기 중</div>
    <div class="current-en" id="currentEn">Tap Play to Start</div>
    <div class="repeat-counter" id="repeatCounter"></div>
  </div>

  <div class="controls">
    <button id="prevBtn">⏮ 이전</button>
    <button class="btn-primary" id="playPauseBtn">▶ 전체 재생</button>
    <button id="nextBtn">다음 ⏭</button>
    <button id="stopBtn">⏹ 정지</button>
  </div>

  <div class="settings-panel">
    <div class="setting-item">
      <label for="speedSelect">영어 낭독 속도:</label>
      <select id="speedSelect">
        <option value="0.85">0.85x</option>
        <option value="0.95" selected>1.0x (표준)</option>
        <option value="1.1">1.1x</option>
      </select>
    </div>
    <div class="setting-item">
      <label for="intervalSelect">문장 간 대기:</label>
      <select id="intervalSelect">
        <option value="600">0.6초</option>
        <option value="1200" selected>1.2초 (표준)</option>
        <option value="2000">2.0초 (따라하기)</option>
      </select>
    </div>
  </div>

  <div class="list-card">
    <div class="list-header">
      <span>쪼개서 말하는 50개 문장 목록</span>
      <span>터치 시 해당 번호 이동</span>
    </div>
    <ul class="sentence-list" id="sentenceList"></ul>
  </div>
</div>

<script>
  const sentences = [
    { ko: "비가 너무 많이 와서 옷이 다 젖었어.", step1: "1단계: I got totally soaked.", en: "I got totally soaked. It rained so hard." },
    { ko: "너무 피곤해서 운동 안 가고 집에 있었어.", step1: "1단계: I stayed home today.", en: "I stayed home today. I was just too tired." },
    { ko: "지갑을 집에 두고 와서 점심을 못 샀어.", step1: "1단계: I couldn't buy lunch.", en: "I couldn't buy lunch. I left my wallet at home." },
    { ko: "배터리가 나가서 문자 온 줄 몰랐어.", step1: "1단계: I missed your text.", en: "I missed your text. My phone died." },
    { ko: "차가 너무 막혀서 회의에 늦었어.", step1: "1단계: I was late for the meeting.", en: "I was late for the meeting. The traffic was terrible." },
    { ko: "영화가 너무 지루해서 중간에 나왔어.", step1: "1단계: I walked out of the movie.", en: "I walked out of the movie. It was so boring." },
    { ko: "손이 미끄러져서 컵을 깨뜨렸어.", step1: "1단계: I broke the cup.", en: "I broke the cup. It slipped from my hand." },
    { ko: "감기 기운이 있어서 일찍 자려고 해.", step1: "1단계: I will go to bed early.", en: "I will go to bed early. I have a cold." },
    { ko: "와이파이가 끊겨서 일을 못 했어.", step1: "1단계: I couldn't do my work.", en: "I couldn't do my work. The Wi-Fi was down." },
    { ko: "늦잠을 자서 아침을 못 먹었어.", step1: "1단계: I skipped breakfast.", en: "I skipped breakfast. I woke up late." },
    { ko: "날씨가 너무 더워서 에어컨을 켰어.", step1: "1단계: I turned on the AC.", en: "I turned on the AC. It was too hot." },
    { ko: "발이 너무 아파서 신발을 벗었어.", step1: "1단계: I took off my shoes.", en: "I took off my shoes. My feet hurt." },
    { ko: "알람을 못 들어서 회사에 지각했어.", step1: "1단계: I was late for work.", en: "I was late for work. I missed my alarm." },
    { ko: "배가 너무 불러서 디저트는 안 먹었어.", step1: "1단계: I skipped dessert.", en: "I skipped dessert. I was completely full." },
    { ko: "커피를 너무 많이 마셔서 잠이 안 와.", step1: "1단계: I can't sleep now.", en: "I can't sleep now. I had too much coffee." },
    { ko: "문이 잠겨 있어서 안에 못 들어갔어.", step1: "1단계: I couldn't get in.", en: "I couldn't get in. The door was locked." },
    { ko: "돈이 모자라서 그 옷을 못 샀어.", step1: "1단계: I didn't buy the jacket.", en: "I didn't buy the jacket. I had no money." },
    { ko: "안경을 두고 와서 글씨가 잘 안 보여.", step1: "1단계: I can't read this.", en: "I can't read this. I forgot my glasses." },
    { ko: "길을 잘못 들어서 한참 돌아왔잖아.", step1: "1단계: I took a long way around.", en: "I took a long way around. I made a wrong turn." },
    { ko: "너무 시끄러워서 통화를 제대로 못 했어.", step1: "1단계: I couldn't hear you well.", en: "I couldn't hear you well. It was too noisy." },
    { ko: "지하철을 잘못 타서 반대쪽으로 갔어.", step1: "1단계: I took the wrong train.", en: "I took the wrong train. It went the other way." },
    { ko: "가방이 너무 무거워서 어깨가 아파.", step1: "1단계: My shoulder hurts.", en: "My shoulder hurts. This bag is too heavy." },
    { ko: "회의가 길어져서 점심시간을 놓쳤어.", step1: "1단계: I missed lunch.", en: "I missed lunch. The meeting ran long." },
    { ko: "음식이 너무 매워서 물만 계속 마셨어.", step1: "1단계: I drank a lot of water.", en: "I drank a lot of water. The food was so spicy." },
    { ko: "비밀번호를 까먹어서 로그인을 못 했어.", step1: "1단계: I couldn't log in.", en: "I couldn't log in. I forgot my password." },
    { ko: "방이 너무 추워서 창문을 닫았어.", step1: "1단계: I closed the window.", en: "I closed the window. The room was freezing." },
    { ko: "폰을 떨어뜨려서 화면이 다 깨졌어.", step1: "1단계: My screen broke.", en: "My screen broke. I dropped my phone." },
    { ko: "우산을 안 챙겨서 비를 다 맞았어.", step1: "1단계: I got wet in the rain.", en: "I got wet in the rain. I had no umbrella." },
    { ko: "할 일이 너무 많아서 야근을 했어.", step1: "1단계: I worked late today.", en: "I worked late today. I had too much work." },
    { ko: "옷에 커피를 쏟아서 바로 갈아입었어.", step1: "1단계: I changed my shirt.", en: "I changed my shirt. I spilled coffee on it." },
    { ko: "계단에서 넘어져서 무릎을 다쳤어.", step1: "1단계: I hurt my knee.", en: "I hurt my knee. I fell down the stairs." },
    { ko: "차에 기름이 없어서 주유소에 들렀어.", step1: "1단계: I stopped at the gas station.", en: "I stopped at the gas station. The tank was empty." },
    { ko: "날씨가 너무 좋아서 한강으로 산책 갔어.", step1: "1단계: I took a walk by the river.", en: "I took a walk by the river. The weather was great." },
    { ko: "몸이 너무 찌뿌둥해서 스트레칭을 했어.", step1: "1단계: I stretched a bit.", en: "I stretched a bit. My body felt stiff." },
    { ko: "목이 너무 말라서 물 한 병을 다 마셨어.", step1: "1단계: I finished a bottle of water.", en: "I finished a bottle of water. I was so thirsty." },
    { ko: "걔가 전화를 안 받아서 문자를 남겼어.", step1: "1단계: I left a text message.", en: "I left a text message. He didn't answer the phone." },
    { ko: "신발이 너무 꽉 끼어서 뒤꿈치가 까졌어.", step1: "1단계: My heel hurts.", en: "My heel hurts. These shoes are too tight." },
    { ko: "일정이 갑자기 바뀌어서 약속을 취소했어.", step1: "1단계: I canceled my plan.", en: "I canceled my plan. My schedule suddenly changed." },
    { ko: "머리가 너무 지끈거려서 두통약을 먹었어.", step1: "1단계: I took a painkiller.", en: "I took a painkiller. I had a bad headache." },
    { ko: "바람이 너무 세게 불어서 모자가 날아갔어.", step1: "1단계: My hat blew away.", en: "My hat blew away. The wind was so strong." },
    { ko: "버스를 놓쳐서 어쩔 수 없이 택시 탔어.", step1: "1단계: I took a taxi.", en: "I took a taxi. I missed the bus." },
    { ko: "음식이 다 식어서 전자레인지에 데웠어.", step1: "1단계: I microwaved the food.", en: "I microwaved the food. It got totally cold." },
    { ko: "조명이 너무 어두워서 스탠드를 켰어.", step1: "1단계: I turned on the lamp.", en: "I turned on the lamp. It was too dark." },
    { ko: "방이 너무 지저분해서 대청소를 했어.", step1: "1단계: I cleaned my room.", en: "I cleaned my room. It was such a mess." },
    { ko: "배탈이 심하게 나서 병원에 다녀왔어.", step1: "1단계: I went to the doctor.", en: "I went to the doctor. My stomach hurt badly." },
    { ko: "설명서가 너무 어려워서 그냥 포기했어.", step1: "1단계: I gave up on it.", en: "I gave up on it. The manual was too confusing." },
    { ko: "프린터 토너가 떨어져서 인쇄를 못 했어.", step1: "1단계: I couldn't print the file.", en: "I couldn't print the file. The toner ran out." },
    { ko: "회의 내용이 이해가 안 돼서 다시 물어봤어.", step1: "1단계: I asked again.", en: "I asked again. I didn't understand the point." },
    { ko: "약속 장소를 헷갈려서 다른 역으로 갔어.", step1: "1단계: I went to the wrong station.", en: "I went to the wrong station. I mixed up the place." },
    { ko: "발표가 무사히 끝나서 마음이 놓여.", step1: "1단계: I feel so relieved now.", en: "I feel so relieved now. The presentation is finally over." }
  ];

  let currentIndex = 0;
  let isRunning = false;
  let synth = window.speechSynthesis;
  let voices = [];
  let isUnlocked = false;

  const playPauseBtn = document.getElementById("playPauseBtn");
  const stopBtn = document.getElementById("stopBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const currentKo = document.getElementById("currentKo");
  const sliceStep = document.getElementById("sliceStep");
  const currentEn = document.getElementById("currentEn");
  const repeatCounter = document.getElementById("repeatCounter");
  const stepBadge = document.getElementById("stepBadge");
  const speakingStatus = document.getElementById("speakingStatus");
  const statusText = document.getElementById("statusText");
  const sentenceList = document.getElementById("sentenceList");
  const speedSelect = document.getElementById("speedSelect");
  const intervalSelect = document.getElementById("intervalSelect");

  function initVoices() {
    voices = synth.getVoices() || [];
  }
  initVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = initVoices;
  }

  function unlockMobileAudio() {
    if (isUnlocked) return;
    try {
      const dummy = new SpeechSynthesisUtterance(" ");
      dummy.volume = 0.01;
      dummy.rate = 2.0;
      synth.speak(dummy);
      isUnlocked = true;
    } catch (e) {
      console.warn("Audio unlock failed", e);
    }
  }

  sentences.forEach((item, idx) => {
    const li = document.createElement("li");
    li.className = "sentence-item";
    li.id = `item-${idx}`;
    li.innerHTML = `
      <div class="item-ko">${idx + 1}. ${item.ko}</div>
      <div class="item-step1">${item.step1}</div>
      <div class="item-en">${item.en}</div>
    `;
    li.addEventListener("click", () => {
      unlockMobileAudio();
      stopPlayback();
      currentIndex = idx;
      updateUI();
      startCycle();
    });
    sentenceList.appendChild(li);
  });

  function updateUI() {
    document.querySelectorAll(".sentence-item").forEach((el, i) => {
      const isSelected = i === currentIndex;
      el.classList.toggle("playing", isSelected);
      if (isSelected) {
        el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    });
    const curr = sentences[currentIndex];
    currentKo.innerText = curr.ko;
    sliceStep.innerText = `💡 ${curr.step1}`;
    currentEn.innerText = curr.en;
    stepBadge.innerText = `문장 ${currentIndex + 1} / ${sentences.length}`;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function speakTextMobile(text, lang, rate = 1.0) {
    return new Promise((resolve) => {
      if (!isRunning) return resolve();

      synth.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = rate;

      if (!voices || voices.length === 0) {
        voices = synth.getVoices() || [];
      }

      if (voices.length > 0) {
        if (lang.startsWith("ko")) {
          const koVoice = voices.find(v => v.lang && (v.lang.includes("ko") || v.lang.includes("KR")));
          if (koVoice) utter.voice = koVoice;
        } else {
          const enVoice = voices.find(v => v.lang && (v.lang.includes("en-US") || v.lang.includes("en_US"))) || voices.find(v => v.lang && v.lang.startsWith("en"));
          if (enVoice) utter.voice = enVoice;
        }
      }

      let isDone = false;
      function finish() {
        if (!isDone) {
          isDone = true;
          clearTimeout(safetyTimeout);
          resolve();
        }
      }

      utter.onend = finish;
      utter.onerror = finish;

      const expectedDuration = (text.length / 5) * 1000 * (1 / rate) + 3500;
      const safetyTimeout = setTimeout(() => {
        finish();
      }, expectedDuration);

      try {
        synth.speak(utter);
      } catch (e) {
        finish();
      }
    });
  }

  async function playSentenceCycle(index) {
    if (!isRunning) return;
    const item = sentences[index];
    const enSpeed = parseFloat(speedSelect.value);
    const delay = parseInt(intervalSelect.value);

    // 1. 한국어 제시
    currentKo.classList.add("active");
    currentEn.classList.remove("active");
    repeatCounter.innerText = "🗣 [1/3] 한국어 제시";
    statusText.innerText = "한국어";
    speakingStatus.classList.add("speaking");

    await speakTextMobile(item.ko, "ko-KR", 1.0);
    currentKo.classList.remove("active");
    await sleep(350);

    if (!isRunning) return;

    // 2. 영어 1회차
    currentEn.classList.add("active");
    repeatCounter.innerText = "🇺🇸 [2/3] 쪼개진 영어 1회";
    statusText.innerText = "영어 1회";
    await speakTextMobile(item.en, "en-US", enSpeed);
    await sleep(delay);

    if (!isRunning) return;

    // 3. 영어 2회차 (따라하기)
    repeatCounter.innerText = "🔁 [3/3] 쪼개진 영어 2회 (따라 말하기)";
    statusText.innerText = "영어 2회";
    await speakTextMobile(item.en, "en-US", Math.max(0.75, enSpeed * 0.92));
    currentEn.classList.remove("active");
    speakingStatus.classList.remove("speaking");
    statusText.innerText = "대기";
    repeatCounter.innerText = "";
    await sleep(delay);
  }

  async function startCycle() {
    unlockMobileAudio();
    isRunning = true;
    playPauseBtn.innerText = "⏸ 일시정지";
    playPauseBtn.classList.remove("btn-primary");

    while (isRunning && currentIndex < sentences.length) {
      updateUI();
      await playSentenceCycle(currentIndex);
      if (!isRunning) break;
      if (currentIndex < sentences.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
        break;
      }
    }

    if (currentIndex === 0 && !isRunning) {
      stopPlayback();
    }
  }

  function stopPlayback() {
    isRunning = false;
    synth.cancel();
    playPauseBtn.innerText = "▶ 전체 재생";
    playPauseBtn.classList.add("btn-primary");
    speakingStatus.classList.remove("speaking");
    statusText.innerText = "정지";
    repeatCounter.innerText = "";
    currentKo.classList.remove("active");
    currentEn.classList.remove("active");
  }

  playPauseBtn.addEventListener("click", () => {
    if (isRunning) {
      stopPlayback();
    } else {
      startCycle();
    }
  });

  stopBtn.addEventListener("click", () => {
    stopPlayback();
    currentIndex = 0;
    updateUI();
  });

  prevBtn.addEventListener("click", () => {
    const wasRunning = isRunning;
    stopPlayback();
    if (currentIndex > 0) currentIndex--;
    updateUI();
    if (wasRunning) startCycle();
  });

  nextBtn.addEventListener("click", () => {
    const wasRunning = isRunning;
    stopPlayback();
    if (currentIndex < sentences.length - 1) currentIndex++;
    updateUI();
    if (wasRunning) startCycle();
  });

  updateUI();
</script>

</body>
</html>
