<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENGLISSI Lab | 원어민식 직결 영어 트레이닝 허브</title>
  <meta name="description" content="한국어 개입을 차단하고 뇌 속 직결 회로를 뚫어주는 인터랙티브 영어 트레이너 포털">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-hover: #19243c;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.15);
      --accent: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --border-focus: #38bdf888;
      --badge-bg: rgba(56, 189, 248, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 내비게이션 */
    header {
      border-bottom: 1px solid var(--border);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 1rem 1.5rem;
    }

    .nav-container {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: #fff;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1rem;
      color: #090d16;
    }

    .brand-name {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-tag {
      font-size: 0.75rem;
      color: var(--primary);
      background: var(--badge-bg);
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-weight: 700;
    }

    /* 히어로 섹션 */
    .hero {
      max-width: 1120px;
      margin: 0 auto;
      padding: 3rem 1.5rem 2rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      background: linear-gradient(180deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.98rem;
      max-width: 660px;
      margin: 0 auto 1.5rem;
      line-height: 1.6;
    }

    .hero-stats {
      display: inline-flex;
      gap: 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.6rem 1.4rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .hero-stats b { color: var(--primary); }

    /* 툴바 (검색 및 카테고리) */
    .toolbar {
      max-width: 1120px;
      margin: 1.5rem auto 1.5rem;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.85rem 1.25rem;
      border-radius: 0.85rem;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: none;
    }
    .filter-group::-webkit-scrollbar { display: none; }

    .filter-chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.45rem 0.95rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-chip.active {
      background: var(--primary);
      color: #090d16;
      border-color: var(--primary);
      font-weight: 700;
    }

    /* 카드 그리드 */
    .grid-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      width: 100%;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.25rem;
    }

    .trainer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.15rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
    }

    .trainer-card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: var(--border-focus);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .card-icon {
      font-size: 2rem;
      background: #090d16;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.85rem;
      border: 1px solid var(--border);
    }

    .card-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.35rem;
    }

    .file-badge {
      font-size: 0.72rem;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      font-weight: 700;
      background: #1e293b;
      color: #94a3b8;
      font-family: monospace;
    }

    .card-badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      font-weight: 700;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .card-title {
      font-size: 1.12rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .meta-cat {
      font-weight: 600;
      color: var(--accent);
    }

    .meta-action {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    footer {
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding: 2rem 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<header>
  <div class="nav-container">
    <a href="./" class="brand">
      <div class="brand-logo">E</div>
      <span class="brand-name">ENGLISSI Lab</span>
    </a>
    <span class="brand-tag">총 11개 코스 완비</span>
  </div>
</header>

<section class="hero">
  <h1>머릿속 번역기를 끄는 직결 영어 연구소</h1>
  <p>한국어 조사와 어순 번역을 걷어내고, 원어민의 인지 회로로 즉시 뱉어내는 11대 인터랙티브 트레이너 모음입니다.</p>
  <div class="hero-stats">
    <span>훈련 프로그램 <b>11개 코스</b></span>
    <span>•</span>
    <span>총 수록 문장 <b>560+ 문항</b></span>
    <span>•</span>
    <span>모바일 오디오 언락 완비</span>
  </div>
</section>

<div class="toolbar">
  <input type="text" class="search-input" id="searchInput" placeholder="훈련하고 싶은 트레이너나 키워드를 검색하세요 (예: english1, 아케이드, 동시 낭독, 쪼개기...)">
  <div class="filter-group" id="filterGroup">
    <button class="filter-chip active" data-cat="all">전체 코스 (11)</button>
    <button class="filter-chip" data-cat="logic">논리/사고 전환</button>
    <button class="filter-chip" data-cat="verb">만능 기본 동사</button>
    <button class="filter-chip" data-cat="scene">장면 시각화</button>
    <button class="filter-chip" data-cat="flow">발화 흐름/필러</button>
  </div>
</div>

<main class="grid-container">
  <div class="card-grid" id="cardGrid"></div>
</main>

<footer>
  <p>© 2026 ENGLISSI Lab. All rights reserved. Direct-Mapping English Audio Suite.</p>
</footer>

<script>
  /* ======================================================================
     📌 11개 트레이너 정식 파일명(english1.html ~ english11.html) 매핑
     ====================================================================== */
  const trainers = [
    {
      id: 1,
      title: "영어 스피킹 자동 낭독 플레이어",
      desc: "일상에서 가장 자주 마주치는 핵심 상황 10가지를 엄선하여 한국어 1회 + 영어 2회 반복 체화",
      path: "english1.html",
      icon: "🎧",
      cat: "flow",
      count: "10문장 집중"
    },
    {
      id: 2,
      title: "초간단 3초 말하기 트레이너",
      desc: "원어민 영어 2회 반복 리듬으로 머릿속 번역 딜레이를 지우고 순발력을 극대화하는 기초 훈련",
      path: "english2.html",
      icon: "⏱️",
      cat: "logic",
      count: "50문장"
    },
    {
      id: 3,
      title: "'I think' 탈출 원어민식 논리 트레이너",
      desc: "초보식 I think 습관을 버리고 원어민처럼 단단한 팩트와 결과 중심 문장으로 의사를 전달하는 화법",
      path: "english3.html",
      icon: "💡",
      cat: "logic",
      count: "50문장"
    },
    {
      id: 4,
      title: "시간 벌기 만능 필러(Filler) 트레이너",
      desc: "말문 막힐 때 '어... 음...' 침묵 대신 자연스럽게 시간 벌고 대화 리듬을 지키는 윤활유 표현",
      path: "english4.html",
      icon: "🗣️",
      cat: "flow",
      count: "50문장"
    },
    {
      id: 5,
      title: "조사 탈피 명사-동사 직결 트레이너",
      desc: "은/는/이/가 토씨를 칼로 썰어내고 명사와 동작을 첫 자리에 툭 던지는 어순 자리 감각 훈련",
      path: "english5.html",
      icon: "✂️",
      cat: "logic",
      count: "50문장"
    },
    {
      id: 6,
      title: "문장 절반 쪼개기 트레이너",
      desc: "복문 번역기 과부하 탈출! 접속사 없이 핵심 결과를 먼저 던지고 이유를 덧붙이는 단문화 기술",
      path: "english6.html",
      icon: "🧩",
      cat: "logic",
      count: "50문장"
    },
    {
      id: 7,
      title: "이미지 연상 영어 트레이너 (GIF 모션)",
      desc: "글자 암기를 멈추고 각 상황별 인터랙티브 움직임 씬을 보며 즉각 묘사하는 1초 시각화 훈련",
      path: "english7.html",
      icon: "🎬",
      cat: "scene",
      count: "50문장"
    },
    {
      id: 8,
      title: "동사 5총사 아케이드 트레이너 (랜덤 셔플)",
      desc: "어려운 형용사를 지우고 GET, TAKE, HAVE, MAKE, PUT으로 3초 만에 쳐내는 타임어택 퀴즈",
      path: "english8.html",
      icon: "⚡",
      cat: "verb",
      count: "50문항 셔플"
    },
    {
      id: 9,
      title: "한국어 개입 차단 직결 트레이너",
      desc: "한글 자막을 뇌에서 끄고 1초 상황 짤을 본 즉시 소리로 반사하는 50개 무성 영화 씬 트레이닝",
      path: "english9.html",
      icon: "🧠",
      cat: "scene",
      count: "50개 씬"
    },
    {
      id: 10,
      title: "통역사식 3초 직결 스피킹 트레이너",
      desc: "수동적 섀도잉은 중단! 상황 캡처 후 [핵심 결과 던지기 + 마침표]로 두 문장 쪼개어 능동 발화",
      path: "english10.html",
      icon: "🎯",
      cat: "logic",
      count: "50문장"
    },
    {
      id: 11,
      title: "동시 낭독(Simultaneous Reading) 100",
      desc: "3-2-1 큐에 맞춰 원어민 음성과 내 목소리를 0.1초 오차 없이 포개어 읽는 100문장 3중 감각 동기화 훈련",
      path: "english11.html",
      icon: "🎙️",
      cat: "flow",
      count: "100문장 완비"
    }
  ];

  const cardGrid = document.getElementById("cardGrid");
  const searchInput = document.getElementById("searchInput");
  const filterChips = document.querySelectorAll(".filter-chip");

  let activeFilter = "all";
  let searchQuery = "";

  function getCategoryName(cat) {
    switch(cat) {
      case "logic": return "논리/사고";
      case "verb": return "기본 동사";
      case "scene": return "장면 시각화";
      case "flow": return "발화 흐름";
      default: return "트레이너";
    }
  }

  function renderCards() {
    cardGrid.innerHTML = "";

    const filtered = trainers.filter(item => {
      const matchesCat = activeFilter === "all" || item.cat === activeFilter;
      const matchesSearch = item.title.toLowerCase().includes(searchQuery) || 
                            item.desc.toLowerCase().includes(searchQuery) ||
                            item.path.toLowerCase().includes(searchQuery);
      return matchesCat && matchesSearch;
    });

    if (filtered.length === 0) {
      cardGrid.innerHTML = `
        <div class="empty-state">
          <h3>일치하는 트레이너를 찾을 수 없습니다.</h3>
          <p>검색어를 다시 확인하시거나 상단 필터를 '전체'로 변경해 보세요.</p>
        </div>
      `;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement("a");
      card.className = "trainer-card";
      card.href = item.path;

      card.innerHTML = `
        <div>
          <div class="card-top">
            <div class="card-icon">${item.icon}</div>
            <div class="card-badges">
              <span class="file-badge">${item.path}</span>
              <span class="card-badge">${item.count}</span>
            </div>
          </div>
          <h2 class="card-title">${item.title}</h2>
          <p class="card-desc">${item.desc}</p>
        </div>
        <div class="card-meta">
          <span class="meta-cat">${getCategoryName(item.cat)}</span>
          <span class="meta-action">시작하기 →</span>
        </div>
      `;
      cardGrid.appendChild(card);
    });
  }

  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderCards();
  });

  filterChips.forEach(chip => {
    chip.addEventListener("click", () => {
      filterChips.forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      activeFilter = chip.getAttribute("data-cat");
      renderCards();
    });
  });

  renderCards();
</script>

</body>
</html>
