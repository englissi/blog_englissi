<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ENGLISSI Lab | 원어민식 직결 영어 & 토익스피킹 허브</title>
  <meta name="description" content="한국어 개입을 차단하고 뇌 속 직결 회로와 토익스피킹 고득점 뼈대를 뚫어주는 인터랙티브 트레이너 포털">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-hover: #19243c;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.15);
      --accent: #818cf8;
      --toeic-accent: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --border-focus: #38bdf888;
      --badge-bg: rgba(56, 189, 248, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 내비게이션 */
    header {
      width: 100%;
      border-bottom: 1px solid var(--border);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0.85rem 1rem;
    }

    .nav-container {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: #fff;
    }

    .brand-logo {
      width: 30px;
      height: 30px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.95rem;
      color: #090d16;
    }

    .brand-name {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-tag {
      font-size: 0.72rem;
      color: var(--primary);
      background: var(--badge-bg);
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* 히어로 섹션 */
    .hero {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 2.2rem 1rem 1.5rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 1.55rem;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 0.6rem;
      background: linear-gradient(180deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      word-break: keep-all;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 0.88rem;
      max-width: 680px;
      margin: 0 auto 1.2rem;
      line-height: 1.5;
      word-break: keep-all;
    }

    .hero-stats {
      display: inline-flex;
      gap: 0.75rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.55rem 1rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      justify-content: center;
      line-height: 1.4;
      max-width: 100%;
    }
    .hero-stats b { color: var(--primary); }
    .hero-stats b.highlight { color: var(--toeic-accent); }

    /* 툴바 */
    .toolbar {
      width: 100%;
      max-width: 1120px;
      margin: 1rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .search-input {
      width: 100%;
      max-width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .filter-group {
      width: 100%;
      display: flex;
      gap: 0.45rem;
      overflow-x: auto;
      padding-bottom: 0.35rem;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-group::-webkit-scrollbar { display: none; }

    .filter-chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.45rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .filter-chip.active {
      background: var(--primary);
      color: #090d16;
      border-color: var(--primary);
      font-weight: 700;
    }

    .filter-chip.special-chip.active {
      background: var(--toeic-accent);
      color: #090d16;
      border-color: var(--toeic-accent);
    }

    /* 카드 그리드 */
    .grid-container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr));
      gap: 1rem;
    }

    .trainer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      min-width: 0;
    }

    .trainer-card:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
      border-color: var(--border-focus);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.85rem;
    }

    .card-icon {
      font-size: 1.8rem;
      background: #090d16;
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.75rem;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    .card-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.25rem;
    }

    .file-badge {
      font-size: 0.68rem;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      font-weight: 700;
      background: #1e293b;
      color: #94a3b8;
      font-family: monospace;
    }

    .card-badge {
      font-size: 0.72rem;
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-weight: 700;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.2);
      white-space: nowrap;
    }

    .card-badge.badge-toeic {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.3);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 0.4rem;
      color: #fff;
      word-break: keep-all;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 1rem;
      word-break: keep-all;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .meta-cat {
      font-weight: 600;
      color: var(--accent);
    }

    .meta-cat.cat-toeic {
      color: var(--toeic-accent);
    }

    .meta-action {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    footer {
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding: 1.75rem 1rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    @media (min-width: 640px) {
      .hero h1 { font-size: 2.1rem; }
      .hero p { font-size: 0.98rem; }
      header { padding: 1rem 1.5rem; }
      .toolbar { padding: 0 1.5rem; }
      .grid-container { padding: 0 1.5rem 4rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="nav-container">
    <a href="./" class="brand">
      <div class="brand-logo">E</div>
      <span class="brand-name">ENGLISSI Lab</span>
    </a>
    <span class="brand-tag">총 16개 코스</span>
  </div>
</header>

<section class="hero">
  <h1>내가 공부하려고 만든 영어 트레이닝 허브</h1>
  <p>모바일에서 접속 시 오른쪽 하단의 점 세 개를 누르시고, "다른 브라우저로 열기"</p>
  <div class="hero-stats">
    <span>훈련 코스 <b>16개</b></span>
    <span>•</span>
    <span>토스 실전 <b class="highlight">350+ 문항</b></span>
    <span>•</span>
    <span>총 수록 <b class="highlight">1060+ 문항</b></span>
  </div>
</section>

<div class="toolbar">
  <input type="text" class="search-input" id="searchInput" placeholder="트레이너 이름 또는 키워드 검색 (예: 토스, english16, 모녀, 쉐도잉...)">
  <div class="filter-group" id="filterGroup">
    <button class="filter-chip active" data-cat="all">전체 (16)</button>
    <button class="filter-chip special-chip" data-cat="toeic">🎯 토익스피킹</button>
    <button class="filter-chip" data-cat="logic">논리/사고</button>
    <button class="filter-chip" data-cat="verb">만능 동사</button>
    <button class="filter-chip" data-cat="scene">장면 캡처</button>
    <button class="filter-chip" data-cat="flow">발화 흐름</button>
  </div>
</div>

<main class="grid-container">
  <div class="card-grid" id="cardGrid"></div>
</main>

<footer>
  <p>© 2026 ENGLISSI Lab. All rights reserved. Direct-Mapping English Audio Suite.</p>
</footer>

<script>
  const trainers = [
    {
      id: 1,
      title: "영어 스피킹 자동 낭독 플레이어",
      desc: "일상 핵심 상황 10가지를 엄선하여 한국어 1회 + 영어 2회 자동 체화 훈련",
      path: "english1.html",
      icon: "🎧",
      cat: "flow",
      count: "10문장 집중"
    },
    {
      id: 2,
      title: "초간단 3초 말하기 트레이너",
      desc: "원어민 영어 2회 반복 리듬으로 머릿속 번역 딜레이를 지우는 순발력 훈련",
      path: "english2.html",
      icon: "⏱️",
      cat: "logic",
      count: "50문장"
    },
    {
      id: 3,
      title: "'I think' 탈출 원어민식 논리 트레이너",
      desc: "I think 습관을 버리고 원어민처럼 단단한 팩트와 결과 중심 문장으로 말하는 법",
      path: "english3.html",
      icon: "💡",
      cat: "logic",
      count: "50문장"
    },
    {
      id: 4,
      title: "시간 벌기 만능 필러(Filler) 트레이너",
      desc: "말문 막힐 때 침묵 대신 자연스럽게 시간 벌고 대화 리듬을 지키는 표현",
      path: "english4.html",
      icon: "🗣️",
      cat: "flow",
      count: "50문장"
    },
    {
      id: 5,
      title: "조사 탈피 명사-동사 직결 트레이너",
      desc: "은/는/이/가 토씨를 썰어내고 명사와 동작을 첫 자리에 툭 던지는 어순 감각",
      path: "english5.html",
      icon: "✂️",
      cat: "logic",
      count: "50문장"
    },
    {
      id: 6,
      title: "문장 절반 쪼개기 트레이너",
      desc: "복문 번역기 탈출! 접속사 없이 핵심 결과를 먼저 던지고 이유를 덧붙이는 단문화 기술",
      path: "english6.html",
      icon: "🧩",
      cat: "logic",
      count: "50문장"
    },
    {
      id: 7,
      title: "이미지 연상 영어 트레이너 (GIF 모션)",
      desc: "글자 암기를 멈추고 상황별 인터랙티브 씬을 보며 즉각 묘사하는 시각화 훈련",
      path: "english7.html",
      icon: "🎬",
      cat: "scene",
      count: "50문장"
    },
    {
      id: 8,
      title: "동사 5총사 아케이드 트레이너 (랜덤 셔플)",
      desc: "형용사를 지우고 GET, TAKE, HAVE, MAKE, PUT으로 3초 만에 쳐내는 퀴즈",
      path: "english8.html",
      icon: "⚡",
      cat: "verb",
      count: "50문항 셔플"
    },
    {
      id: 9,
      title: "한국어 개입 차단 직결 트레이너",
      desc: "한글 자막을 뇌에서 끄고 1초 짤을 본 즉시 소리로 반사하는 무성 영화 씬 트레이닝",
      path: "english9.html",
      icon: "🧠",
      cat: "scene",
      count: "50개 씬"
    },
    {
      id: 10,
      title: "통역사식 3초 직결 스피킹 트레이너",
      desc: "섀도잉 중단! 상황 캡처 후 [핵심 결과 + 마침표]로 두 문장 쪼개어 능동 발화",
      path: "english10.html",
      icon: "🎯",
      cat: "logic",
      count: "50문장"
    },
    {
      id: 11,
      title: "동시 낭독(Simultaneous Reading) 100",
      desc: "3-2-1 큐에 맞춰 원어민 음성과 내 목소리를 0.1초 오차 없이 포개어 읽는 훈련",
      path: "english11.html",
      icon: "🎙️",
      cat: "flow",
      count: "100문장 완비"
    },
    {
      id: 12,
      title: "생각의 뼈대(PREP) 남녀 티키타카 50",
      desc: "토익스피킹 면접관 질문에 4단계 PREP(결론-이유-사례-마침표)로 1초 만에 받아치기",
      path: "english12.html",
      icon: "👥",
      cat: "toeic",
      count: "토스 50세트"
    },
    {
      id: 13,
      title: "토스 1초 단문 페어링 & 음성 싱크 트레이너",
      desc: "접속사 없이 [결론 + 팩트] 연타 및 마이크 녹음으로 원어민 싱크로율(0~100%) 측정",
      path: "english13.html",
      icon: "🎯",
      cat: "toeic",
      count: "토스 100세트"
    },
    {
      id: 14,
      title: "워킹맘·직장인 1초 쉐도잉 트레이너 50",
      desc: "기상부터 퇴근 후 힐링까지 일상 50문장 쉐도잉 및 실시간 음성 싱크로율 분석",
      path: "english14.html",
      icon: "🤱",
      cat: "flow",
      count: "50문장 완비"
    },
    {
      id: 15,
      title: "토스 200 만능문장 쉐도잉 플레이어 (도메인 셀렉터)",
      desc: "10대 핵심 도메인별 200문장 엄선! 한글 1회+영어 3회 무한 반복 쉐도잉 트레이너",
      path: "english15.html",
      icon: "🔁",
      cat: "toeic",
      count: "만능 200문장"
    },
    {
      id: 16,
      title: "모녀 실전 티키타카 100 (엄마 & 15세 딸)",
      desc: "사춘기 딸과 엄마의 일상 100문답! [엄마 롤플레잉 / 딸 롤플레잉 / 모녀 전체 듣기] 3가지 모드 지원",
      path: "english16.html",
      icon: "👩‍👧",
      cat: "flow",
      count: "100세트 완비"
    }
  ];

  const cardGrid = document.getElementById("cardGrid");
  const searchInput = document.getElementById("searchInput");
  const filterChips = document.querySelectorAll(".filter-chip");

  let activeFilter = "all";
  let searchQuery = "";

  function getCategoryName(cat) {
    switch(cat) {
      case "toeic": return "토익스피킹";
      case "logic": return "논리/사고";
      case "verb": return "기본 동사";
      case "scene": return "장면 시각화";
      case "flow": return "발화 흐름";
      default: return "트레이너";
    }
  }

  function renderCards() {
    cardGrid.innerHTML = "";

    const filtered = trainers.filter(item => {
      const matchesCat = activeFilter === "all" || item.cat === activeFilter;
      const matchesSearch = item.title.toLowerCase().includes(searchQuery) || 
                            item.desc.toLowerCase().includes(searchQuery) ||
                            item.path.toLowerCase().includes(searchQuery) ||
                            (item.cat === "toeic" && searchQuery.includes("토스"));
      return matchesCat && matchesSearch;
    });

    if (filtered.length === 0) {
      cardGrid.innerHTML = `
        <div class="empty-state">
          <h3>일치하는 트레이너를 찾을 수 없습니다.</h3>
          <p>검색어를 다시 확인하시거나 상단 필터를 '전체'로 변경해 보세요.</p>
        </div>
      `;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement("a");
      card.className = "trainer-card";
      card.href = item.path;

      const isToeic = item.cat === "toeic";

      card.innerHTML = `
        <div>
          <div class="card-top">
            <div class="card-icon">${item.icon}</div>
            <div class="card-badges">
              <span class="file-badge">${item.path}</span>
              <span class="card-badge ${isToeic ? 'badge-toeic' : ''}">${item.count}</span>
            </div>
          </div>
          <h2 class="card-title">${item.title}</h2>
          <p class="card-desc">${item.desc}</p>
        </div>
        <div class="card-meta">
          <span class="meta-cat ${isToeic ? 'cat-toeic' : ''}">${getCategoryName(item.cat)}</span>
          <span class="meta-action">시작하기 →</span>
        </div>
      `;
      cardGrid.appendChild(card);
    });
  }

  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderCards();
  });

  filterChips.forEach(chip => {
    chip.addEventListener("click", () => {
      filterChips.forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      activeFilter = chip.getAttribute("data-cat");
      renderCards();
    });
  });

  renderCards();
</script>

</body>
</html>
