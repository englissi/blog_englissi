<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENGLISSI Lab | 원어민식 직결 영어 트레이닝 허브</title>
  <meta name="description" content="한국어 개입을 차단하고 뇌 속 직결 회로를 뚫어주는 인터랙티브 영어 트레이너 포털">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-hover: #19243c;
      --primary: #38bdf8;
      --primary-glow: rgba(56, 189, 248, 0.15);
      --accent: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #1e293b;
      --border-focus: #38bdf888;
      --badge-bg: rgba(56, 189, 248, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 상단 내비게이션 */
    header {
      border-bottom: 1px solid var(--border);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 1rem 1.5rem;
    }

    .nav-container {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: #fff;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.9rem;
      color: #090d16;
    }

    .brand-name {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-tag {
      font-size: 0.75rem;
      color: var(--primary);
      background: var(--badge-bg);
      padding: 0.15rem 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
    }

    /* 메인 히어로 섹션 */
    .hero {
      max-width: 1080px;
      margin: 0 auto;
      padding: 3rem 1.5rem 2rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 0.75rem;
      background: linear-gradient(180deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 620px;
      margin: 0 auto 2rem;
      line-height: 1.6;
    }

    /* 검색 & 필터 툴바 */
    .toolbar {
      max-width: 1080px;
      margin: 0 auto 1.5rem;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.85rem 1.25rem;
      border-radius: 0.85rem;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
      scrollbar-width: none;
    }
    .filter-group::-webkit-scrollbar { display: none; }

    .filter-chip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.45rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .filter-chip.active {
      background: var(--primary);
      color: #090d16;
      border-color: var(--primary);
      font-weight: 700;
    }

    /* 트레이너 카드 그리드 */
    .grid-container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
      width: 100%;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1.25rem;
    }

    .trainer-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.15rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .trainer-card:hover {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: var(--border-focus);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }

    .card-icon {
      font-size: 2.2rem;
      background: #090d16;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.85rem;
      border: 1px solid var(--border);
    }

    .card-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-weight: 700;
      background: var(--badge-bg);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .meta-count {
      font-weight: 600;
      color: var(--accent);
    }

    .meta-action {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* 빈 상태 안내 */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    /* 푸터 */
    footer {
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding: 2rem 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<header>
  <div class="nav-container">
    <a href="./" class="brand">
      <div class="brand-logo">E</div>
      <span class="brand-name">ENGLISSI Lab</span>
    </a>
    <span class="brand-tag">Interactive Audio Suite</span>
  </div>
</header>

<section class="hero">
  <h1>머릿속 번역기를 끄는 직결 영어 연구소</h1>
  <p>한국어 조사와 문법 번역을 건너뛰고, 원어민의 인지 회로(이미지 캡처 · 기본 동사 직결)로 즉시 뱉는 인터랙티브 훈련 도구 모음입니다.</p>
</section>

<div class="toolbar">
  <input type="text" class="search-input" id="searchInput" placeholder="훈련하고 싶은 주제나 동사를 검색하세요 (예: 기본 동사, 조사, 쪼개기, I think...)">
  <div class="filter-group" id="filterGroup">
    <button class="filter-chip active" data-cat="all">전체 트레이너</button>
    <button class="filter-chip" data-cat="logic">논리/사고 전환</button>
    <button class="filter-chip" data-cat="verb">만능 기본 동사</button>
    <button class="filter-chip" data-cat="scene">장면 시각화</button>
  </div>
</div>

<main class="grid-container">
  <div class="card-grid" id="cardGrid"></div>
</main>

<footer>
  <p>© 2026 ENGLISSI Lab. All rights reserved. Designed for Mobile & Desktop Direct-Mapping Training.</p>
</footer>

<script>
  /* ======================================================================
     📌 [페이지 추가 가이드]
     새로운 HTML 파일을 리포지토리에 추가하셨다면, 아래 배열에 객체 1줄만 추가하세요!
     - title: 카드에 표시될 이름
     - desc: 간단한 설명
     - path: 생성한 html 파일명 (예: 'verb5_arcade.html')
     - icon: 카드 아이콘 이모지
     - cat: 필터 분류 ('logic' | 'verb' | 'scene')
     - count: 문장/문제 수
     ====================================================================== */
  const trainers = [
    {
      title: "동사 5총사 아케이드 트레이너",
      desc: "어려운 형용사를 지우고 GET, TAKE, HAVE, MAKE, PUT으로 3초 만에 해결하는 타임어택 퀴즈",
      path: "verb5_arcade.html", // 실제 업로드한 파일명으로 매칭
      icon: "⚡",
      cat: "verb",
      count: "50문항 랜덤 셔플"
    },
    {
      title: "한국어 개입 차단 직결 트레이너",
      desc: "한글 자막을 뇌에서 끄고 1초 상황 짤을 본 즉시 소리로 반사하는 무성 영화 씬 트레이닝",
      path: "direct_scene.html",
      icon: "🧠",
      cat: "scene",
      count: "50개 씬"
    },
    {
      title: "통역사식 3초 직결 스피킹",
      desc: "영혼 없는 섀도잉은 중단! 상황 캡처 후 [핵심 결과 던지기 + 마침표]로 두 문장 쪼개어 말하기",
      path: "interpreter_split.html",
      icon: "🎯",
      cat: "logic",
      count: "50문장"
    },
    {
      title: "조사(은/는/이/가) 탈피 직결 훈련",
      desc: "한국어 토씨를 칼로 썰어내고 명사와 동작을 첫 자리에 툭 던지는 어순 자리 훈련",
      path: "drop_particles.html",
      icon: "✂️",
      cat: "logic",
      count: "50문장"
    },
    {
      title: "'I think' 탈출 원어민 논리 트레이너",
      desc: "초보식 I think 습관을 버리고 원어민처럼 단단한 팩트와 결과로 의사를 전달하는 화법",
      path: "ithink_escape.html",
      icon: "💡",
      cat: "logic",
      count: "50문장"
    },
    {
      title: "이미지 연상 1초 짤 모션 트레이너",
      desc: "글자 암기를 멈추고 각 상황별 인터랙티브 움직임 씬을 보며 즉각 묘사하는 감각 훈련",
      path: "image_motion.html",
      icon: "🎬",
      cat: "scene",
      count: "50문장"
    }
  ];

  const cardGrid = document.getElementById("cardGrid");
  const searchInput = document.getElementById("searchInput");
  const filterChips = document.querySelectorAll(".filter-chip");

  let activeFilter = "all";
  let searchQuery = "";

  function renderCards() {
    cardGrid.innerHTML = "";

    const filtered = trainers.filter(item => {
      const matchesCat = activeFilter === "all" || item.cat === activeFilter;
      const matchesSearch = item.title.toLowerCase().includes(searchQuery) || 
                            item.desc.toLowerCase().includes(searchQuery);
      return matchesCat && matchesSearch;
    });

    if (filtered.length === 0) {
      cardGrid.innerHTML = `
        <div class="empty-state">
          <h3>일치하는 트레이너를 찾을 수 없습니다.</h3>
          <p>검색어를 다시 확인하시거나 전체 필터를 선택해 보세요.</p>
        </div>
      `;
      return;
    }

    filtered.forEach(item => {
      const card = document.createElement("a");
      card.className = "trainer-card";
      card.href = item.path;

      card.innerHTML = `
        <div>
          <div class="card-top">
            <div class="card-icon">${item.icon}</div>
            <span class="card-badge">${item.count}</span>
          </div>
          <h2 class="card-title">${item.title}</h2>
          <p class="card-desc">${item.desc}</p>
        </div>
        <div class="card-meta">
          <span class="meta-count">${getCategoryName(item.cat)}</span>
          <span class="meta-action">트레이닝 시작 →</span>
        </div>
      `;
      cardGrid.appendChild(card);
    });
  }

  function getCategoryName(cat) {
    switch(cat) {
      case "logic": return "논리/사고";
      case "verb": return "기본 동사";
      case "scene": return "장면 시각화";
      default: return "트레이너";
    }
  }

  // 검색 리스너
  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderCards();
  });

  // 카테고리 필터 리스너
  filterChips.forEach(chip => {
    chip.addEventListener("click", () => {
      filterChips.forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      activeFilter = chip.getAttribute("data-cat");
      renderCards();
    });
  });

  // 초기 렌더링
  renderCards();
</script>

</body>
</html>
