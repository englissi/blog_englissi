<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>조사 탈피 명사-동사 직결 트레이너 (50문장)</title>
  <style>
    :root {
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #c084fc;
      --tag-bg: rgba(139, 92, 246, 0.15);
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem 0.75rem 2rem;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    header {
      text-align: center;
      padding: 0.5rem 0;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.3rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .display-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2rem 1rem 1.5rem;
      text-align: center;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .step-badge {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: #334155;
      color: var(--accent);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .speaking-status {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .speaking .dot {
      background: #a855f7;
      box-shadow: 0 0 8px #a855f7;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .current-ko {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      transition: color 0.2s;
      line-height: 1.4;
      word-break: keep-all;
    }

    .current-ko.active {
      color: #fff;
      font-weight: 700;
    }

    .chunk-box {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.8rem;
      background: var(--tag-bg);
      border: 1px solid rgba(192, 132, 252, 0.4);
      color: var(--accent);
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .current-en {
      font-size: 1.35rem;
      font-weight: 700;
      color: #64748b;
      line-height: 1.35;
      transition: color 0.2s;
      word-break: keep-all;
    }

    .current-en.active {
      color: var(--accent);
    }

    .repeat-counter {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: 600;
      min-height: 1.2rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.65rem 1rem;
      border-radius: 0.6rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      user-select: none;
    }

    button:active {
      transform: scale(0.98);
      background: #334155;
    }

    button.btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    button.btn-primary:hover {
      background: var(--primary-hover);
    }

    .settings-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.85rem;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    select {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.3rem 0.5rem;
      border-radius: 0.4rem;
      outline: none;
      font-size: 0.85rem;
    }

    .list-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
    }

    .list-header {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
    }

    .sentence-list {
      list-style: none;
      max-height: 380px;
      overflow-y: auto;
    }

    .sentence-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #33415544;
      cursor: pointer;
    }

    .sentence-item:last-child {
      border-bottom: none;
    }

    .sentence-item.playing {
      background: rgba(139, 92, 246, 0.12);
      border-left: 4px solid var(--primary);
    }

    .item-ko {
      font-size: 0.85rem;
      margin-bottom: 0.2rem;
      color: #cbd5e1;
    }

    .item-chunk {
      font-size: 0.8rem;
      color: #c084fc;
      margin-bottom: 0.2rem;
    }

    .item-en {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e9d5ff;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>조사 탈피 명사-동사 직결 트레이너</h1>
    <p>아래 [▶ 전체 재생] 버튼을 터치하면 오디오가 활성화됩니다.</p>
  </header>

  <div class="display-card" id="displayCard">
    <div class="step-badge" id="stepBadge">대기 중</div>
    <div class="speaking-status" id="speakingStatus">
      <div class="dot"></div>
      <span id="statusText">정지</span>
    </div>

    <div class="current-ko" id="currentKo">재생 버튼을 터치해 훈련을 시작하세요.</div>
    <div class="chunk-box" id="chunkBox">💡 조사 뺀 알맹이: 대기 중</div>
    <div class="current-en" id="currentEn">Tap Play to Start</div>
    <div class="repeat-counter" id="repeatCounter"></div>
  </div>

  <div class="controls">
    <button id="prevBtn">⏮ 이전</button>
    <button class="btn-primary" id="playPauseBtn">▶ 전체 재생</button>
    <button id="nextBtn">다음 ⏭</button>
    <button id="stopBtn">⏹ 정지</button>
  </div>

  <div class="settings-panel">
    <div class="setting-item">
      <label for="speedSelect">영어 낭독 속도:</label>
      <select id="speedSelect">
        <option value="0.85">0.85x</option>
        <option value="0.95" selected>1.0x (표준)</option>
        <option value="1.1">1.1x</option>
      </select>
    </div>
    <div class="setting-item">
      <label for="intervalSelect">문장 간 대기:</label>
      <select id="intervalSelect">
        <option value="600">0.6초</option>
        <option value="1200" selected>1.2초 (표준)</option>
        <option value="2000">2.0초 (따라하기)</option>
      </select>
    </div>
  </div>

  <div class="list-card">
    <div class="list-header">
      <span>조사 탈피 50개 문장 목록</span>
      <span>터치 시 해당 번호 이동</span>
    </div>
    <ul class="sentence-list" id="sentenceList"></ul>
  </div>
</div>

<script>
  const sentences = [
    { ko: "커피는 내가 살게.", chunk: "나 + 사다 + 커피", en: "I will buy the coffee." },
    { ko: "지갑은 걔가 잃어버렸어.", chunk: "걔 + 잃어버리다 + 지갑", en: "He lost the wallet." },
    { ko: "문은 내가 닫았어.", chunk: "나 + 닫다 + 문", en: "I closed the door." },
    { ko: "버스는 우리가 놓쳤어.", chunk: "우리 + 놓치다 + 버스", en: "We missed the bus." },
    { ko: "그 영화는 내가 봤어.", chunk: "나 + 보다 + 그 영화", en: "I saw that movie." },
    { ko: "숙제는 동생이 다 했어.", chunk: "동생 + 끝내다 + 숙제", en: "My brother finished the homework." },
    { ko: "피자는 걔네가 주문했어.", chunk: "걔네 + 주문하다 + 피자", en: "They ordered the pizza." },
    { ko: "불은 내가 껐어.", chunk: "나 + 끄다 + 불", en: "I turned off the light." },
    { ko: "전화는 네가 안 받았잖아.", chunk: "너 + 놓치다 + 전화", en: "You missed my call." },
    { ko: "택시는 우리가 탔어.", chunk: "우리 + 타다 + 택시", en: "We took a taxi." },
    { ko: "물은 내가 마셨어.", chunk: "나 + 마시다 + 물", en: "I drank the water." },
    { ko: "창문은 바람이 깼어.", chunk: "바람 + 깨다 + 창문", en: "The wind broke the window." },
    { ko: "점심은 내가 굶었어.", chunk: "나 + 거르다 + 점심", en: "I skipped lunch." },
    { ko: "우산은 엄마가 챙겼어.", chunk: "엄마 + 챙기다 + 우산", en: "Mom brought the umbrella." },
    { ko: "안경은 내가 썼어.", chunk: "나 + 쓰다 + 안경", en: "I put on the glasses." },
    { ko: "가방은 친구가 들어줬어.", chunk: "친구 + 들다 + 가방", en: "My friend carried the bag." },
    { ko: "열쇠는 삼촌이 찾았어.", chunk: "삼촌 + 찾다 + 열쇠", en: "My uncle found the key." },
    { ko: "사진은 내가 찍었어.", chunk: "나 + 찍다 + 사진", en: "I took the picture." },
    { ko: "돈은 걔가 냈어.", chunk: "걔 + 내다 + 돈", en: "He paid the money." },
    { ko: "모자는 바람에 날아갔어.", chunk: "바람 + 날리다 + 모자", en: "The wind blew my hat." },
    { ko: "약은 내가 먹었어.", chunk: "나 + 먹다 + 약", en: "I took the medicine." },
    { ko: "음악은 언니가 틀었어.", chunk: "언니 + 틀다 + 음악", en: "My sister played the music." },
    { ko: "옷은 내가 갈아입었어.", chunk: "나 + 갈아입다 + 옷", en: "I changed my clothes." },
    { ko: "신발은 내가 벗었어.", chunk: "나 + 벗다 + 신발", en: "I took off my shoes." },
    { ko: "TV는 아빠가 껐어.", chunk: "아빠 + 끄다 + TV", en: "Dad turned off the TV." },
    { ko: "손은 내가 씻었어.", chunk: "나 + 씻다 + 손", en: "I washed my hands." },
    { ko: "차는 형이 운전했어.", chunk: "형 + 운전하다 + 차", en: "My brother drove the car." },
    { ko: "컴퓨터는 내가 켰어.", chunk: "나 + 켜다 + 컴퓨터", en: "I turned on the PC." },
    { ko: "편지는 걔가 보냈어.", chunk: "걔 + 보내다 + 편지", en: "She sent the letter." },
    { ko: "의자는 내가 옮겼어.", chunk: "나 + 옮기다 + 의자", en: "I moved the chair." },
    { ko: "빵은 내가 먹었어.", chunk: "나 + 먹다 + 빵", en: "I ate the bread." },
    { ko: "책은 걔가 빌려갔어.", chunk: "걔 + 빌리다 + 책", en: "He borrowed the book." },
    { ko: "폰은 내가 떨어뜨렸어.", chunk: "나 + 떨어뜨리다 + 폰", en: "I dropped my phone." },
    { ko: "길은 지도가 알려줬어.", chunk: "지도 + 보여주다 + 길", en: "The map showed the way." },
    { ko: "노래는 우리가 불렀어.", chunk: "우리 + 부르다 + 노래", en: "We sang the song." },
    { ko: "방은 내가 치웠어.", chunk: "나 + 치우다 + 방", en: "I cleaned the room." },
    { ko: "사과는 내가 깎았어.", chunk: "나 + 깎다 + 사과", en: "I cut the apple." },
    { ko: "우유는 고양이가 마셨어.", chunk: "고양이 + 마시다 + 우유", en: "The cat drank the milk." },
    { ko: "자전거는 내가 고쳤어.", chunk: "나 + 고치다 + 자전거", en: "I fixed the bike." },
    { ko: "비밀은 걔가 말했어.", chunk: "걔 + 말하다 + 비밀", en: "She told the secret." },
    { ko: "커피는 걔가 쏟았어.", chunk: "걔 + 쏟다 + 커피", en: "He spilled the coffee." },
    { ko: "꽃은 내가 샀어.", chunk: "나 + 사다 + 꽃", en: "I bought the flowers." },
    { ko: "계란은 엄마가 부쳤어.", chunk: "엄마 + 부치다 + 계란", en: "Mom fried the eggs." },
    { ko: "표는 내가 예매했어.", chunk: "나 + 예매하다 + 표", en: "I booked the ticket." },
    { ko: "소금은 걔가 넣었어.", chunk: "걔 + 넣다 + 소금", en: "He added the salt." },
    { ko: "비행기는 우리가 탔어.", chunk: "우리 + 타다 + 비행기", en: "We took the plane." },
    { ko: "불침번은 내가 섰어.", chunk: "나 + 보다 + 불침번", en: "I took the watch." },
    { ko: "선물은 친구가 줬어.", chunk: "친구 + 주다 + 선물", en: "My friend gave the gift." },
    { ko: "메시지는 내가 확인했어.", chunk: "나 + 확인하다 + 메시지", en: "I checked the message." },
    { ko: "결과는 모두가 봤어.", chunk: "모두 + 보다 + 결과", en: "Everyone saw the result." }
  ];

  let currentIndex = 0;
  let isRunning = false;
  let synth = window.speechSynthesis;
  let voices = [];
  let isUnlocked = false;

  const playPauseBtn = document.getElementById("playPauseBtn");
  const stopBtn = document.getElementById("stopBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const currentKo = document.getElementById("currentKo");
  const chunkBox = document.getElementById("chunkBox");
  const currentEn = document.getElementById("currentEn");
  const repeatCounter = document.getElementById("repeatCounter");
  const stepBadge = document.getElementById("stepBadge");
  const speakingStatus = document.getElementById("speakingStatus");
  const statusText = document.getElementById("statusText");
  const sentenceList = document.getElementById("sentenceList");
  const speedSelect = document.getElementById("speedSelect");
  const intervalSelect = document.getElementById("intervalSelect");

  function initVoices() {
    voices = synth.getVoices() || [];
  }
  initVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = initVoices;
  }

  function unlockMobileAudio() {
    if (isUnlocked) return;
    try {
      const dummy = new SpeechSynthesisUtterance(" ");
      dummy.volume = 0.01;
      dummy.rate = 2.0;
      synth.speak(dummy);
      isUnlocked = true;
    } catch (e) {
      console.warn("Audio unlock failed", e);
    }
  }

  sentences.forEach((item, idx) => {
    const li = document.createElement("li");
    li.className = "sentence-item";
    li.id = `item-${idx}`;
    li.innerHTML = `
      <div class="item-ko">${idx + 1}. ${item.ko}</div>
      <div class="item-chunk">알맹이: ${item.chunk}</div>
      <div class="item-en">${item.en}</div>
    `;
    li.addEventListener("click", () => {
      unlockMobileAudio();
      stopPlayback();
      currentIndex = idx;
      updateUI();
      startCycle();
    });
    sentenceList.appendChild(li);
  });

  function updateUI() {
    document.querySelectorAll(".sentence-item").forEach((el, i) => {
      const isSelected = i === currentIndex;
      el.classList.toggle("playing", isSelected);
      if (isSelected) {
        el.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    });
    const curr = sentences[currentIndex];
    currentKo.innerText = curr.ko;
    chunkBox.innerText = `💡 조사 뺀 알맹이: ${curr.chunk}`;
    currentEn.innerText = curr.en;
    stepBadge.innerText = `문장 ${currentIndex + 1} / ${sentences.length}`;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function speakTextMobile(text, lang, rate = 1.0) {
    return new Promise((resolve) => {
      if (!isRunning) return resolve();

      synth.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = rate;

      if (!voices || voices.length === 0) {
        voices = synth.getVoices() || [];
      }

      if (voices.length > 0) {
        if (lang.startsWith("ko")) {
          const koVoice = voices.find(v => v.lang && (v.lang.includes("ko") || v.lang.includes("KR")));
          if (koVoice) utter.voice = koVoice;
        } else {
          const enVoice = voices.find(v => v.lang && (v.lang.includes("en-US") || v.lang.includes("en_US"))) || voices.find(v => v.lang && v.lang.startsWith("en"));
          if (enVoice) utter.voice = enVoice;
        }
      }

      let isDone = false;
      function finish() {
        if (!isDone) {
          isDone = true;
          clearTimeout(safetyTimeout);
          resolve();
        }
      }

      utter.onend = finish;
      utter.onerror = finish;

      const expectedDuration = (text.length / 5) * 1000 * (1 / rate) + 3500;
      const safetyTimeout = setTimeout(() => {
        finish();
      }, expectedDuration);

      try {
        synth.speak(utter);
      } catch (e) {
        finish();
      }
    });
  }

  async function playSentenceCycle(index) {
    if (!isRunning) return;
    const item = sentences[index];
    const enSpeed = parseFloat(speedSelect.value);
    const delay = parseInt(intervalSelect.value);

    // 1. 한국어 제시
    currentKo.classList.add("active");
    currentEn.classList.remove("active");
    repeatCounter.innerText = "🗣 [1/3] 한국어 제시";
    statusText.innerText = "한국어";
    speakingStatus.classList.add("speaking");

    await speakTextMobile(item.ko, "ko-KR", 1.0);
    currentKo.classList.remove("active");
    await sleep(350);

    if (!isRunning) return;

    // 2. 영어 1회차
    currentEn.classList.add("active");
    repeatCounter.innerText = "🇺🇸 [2/3] 직결 영어 1회";
    statusText.innerText = "영어 1회";
    await speakTextMobile(item.en, "en-US", enSpeed);
    await sleep(delay);

    if (!isRunning) return;

    // 3. 영어 2회차 (따라하기)
    repeatCounter.innerText = "🔁 [3/3] 직결 영어 2회 (따라 말하기)";
    statusText.innerText = "영어 2회";
    await speakTextMobile(item.en, "en-US", Math.max(0.75, enSpeed * 0.92));
    currentEn.classList.remove("active");
    speakingStatus.classList.remove("speaking");
    statusText.innerText = "대기";
    repeatCounter.innerText = "";
    await sleep(delay);
  }

  async function startCycle() {
    unlockMobileAudio();
    isRunning = true;
    playPauseBtn.innerText = "⏸ 일시정지";
    playPauseBtn.classList.remove("btn-primary");

    while (isRunning && currentIndex < sentences.length) {
      updateUI();
      await playSentenceCycle(currentIndex);
      if (!isRunning) break;
      if (currentIndex < sentences.length - 1) {
        currentIndex++;
      } else {
        currentIndex = 0;
        break;
      }
    }

    if (currentIndex === 0 && !isRunning) {
      stopPlayback();
    }
  }

  function stopPlayback() {
    isRunning = false;
    synth.cancel();
    playPauseBtn.innerText = "▶ 전체 재생";
    playPauseBtn.classList.add("btn-primary");
    speakingStatus.classList.remove("speaking");
    statusText.innerText = "정지";
    repeatCounter.innerText = "";
    currentKo.classList.remove("active");
    currentEn.classList.remove("active");
  }

  playPauseBtn.addEventListener("click", () => {
    if (isRunning) {
      stopPlayback();
    } else {
      startCycle();
    }
  });

  stopBtn.addEventListener("click", () => {
    stopPlayback();
    currentIndex = 0;
    updateUI();
  });

  prevBtn.addEventListener("click", () => {
    const wasRunning = isRunning;
    stopPlayback();
    if (currentIndex > 0) currentIndex--;
    updateUI();
    if (wasRunning) startCycle();
  });

  nextBtn.addEventListener("click", () => {
    const wasRunning = isRunning;
    stopPlayback();
    if (currentIndex < sentences.length - 1) currentIndex++;
    updateUI();
    if (wasRunning) startCycle();
  });

  updateUI();
</script>

</body>
</html>
