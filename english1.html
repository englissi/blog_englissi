<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 스피킹 트레이너 - 한국어 1회 + 영어 2회 반복</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --highlight: #f59e0b;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* 디스플레이 뷰어 */
    .display-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .step-badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: #334155;
      color: var(--accent);
      padding: 0.3rem 0.8rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .speaking-status {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .speaking .dot {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.3); }
    }

    .current-ko {
      font-size: 1.25rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      transition: all 0.2s;
    }

    .current-ko.active {
      color: #fff;
      font-weight: 600;
      transform: scale(1.02);
    }

    .current-en {
      font-size: 1.6rem;
      font-weight: 700;
      color: #64748b;
      line-height: 1.4;
      transition: all 0.2s;
    }

    .current-en.active {
      color: var(--accent);
      transform: scale(1.05);
    }

    .repeat-counter {
      margin-top: 1.25rem;
      font-size: 0.9rem;
      color: var(--highlight);
      font-weight: 600;
      min-height: 1.2rem;
    }

    /* 조작 바 */
    .controls {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    button {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    button:hover {
      background: #334155;
    }

    button.btn-primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    button.btn-primary:hover {
      background: var(--primary-hover);
    }

    /* 설정 */
    .settings-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.9rem;
    }

    .setting-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    select, input[type="range"] {
      background: #0f172a;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.35rem 0.5rem;
      border-radius: 0.4rem;
      outline: none;
    }

    /* 리스트 */
    .list-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      overflow: hidden;
    }

    .list-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .sentence-list {
      list-style: none;
      max-height: 380px;
      overflow-y: auto;
    }

    .sentence-item {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid #33415544;
      cursor: pointer;
      transition: background 0.15s;
    }

    .sentence-item:last-child {
      border-bottom: none;
    }

    .sentence-item:hover {
      background: #33415555;
    }

    .sentence-item.playing {
      background: #2563eb18;
      border-left: 4px solid var(--primary);
    }

    .item-ko {
      font-size: 0.95rem;
      margin-bottom: 0.25rem;
      color: #cbd5e1;
    }

    .item-en {
      font-size: 1.05rem;
      font-weight: 600;
      color: #93c5fd;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>영어 스피킹 자동 낭독 플레이어</h1>
    <p>한국어 1회 제시 후 원어민 영어 발음으로 2회 연속 낭독됩니다.</p>
  </header>

  <!-- 현재 진행 디스플레이 -->
  <div class="display-card" id="displayCard">
    <div class="step-badge" id="stepBadge">대기 중</div>
    <div class="speaking-status" id="speakingStatus">
      <div class="dot"></div>
      <span id="statusText">정지</span>
    </div>

    <div class="current-ko" id="currentKo">시작 버튼을 누르면 자동 낭독이 시작됩니다.</div>
    <div class="current-en" id="currentEn">Click Play to Start</div>
    <div class="repeat-counter" id="repeatCounter"></div>
  </div>

  <!-- 조작 바 -->
  <div class="controls">
    <button id="prevBtn">⏮ 이전</button>
    <button class="btn-primary" id="playPauseBtn">▶ 전체 자동 재생</button>
    <button id="nextBtn">다음 ⏭</button>
    <button id="stopBtn">⏹ 정지</button>
  </div>

  <!-- 보이스 & 속도 세팅 -->
  <div class="settings-panel">
    <div class="setting-item">
      <label for="speedSelect">영어 낭독 속도:</label>
      <select id="speedSelect">
        <option value="0.8">0.8x (천천히)</option>
        <option value="0.95" selected>1.0x (보통)</option>
        <option value="1.15">1.2x (빠르게)</option>
      </select>
    </div>
    <div class="setting-item">
      <label for="intervalSelect">문장 간 간격:</label>
      <select id="intervalSelect">
        <option value="600">짧게 (0.6초)</option>
        <option value="1200" selected>표준 (1.2초)</option>
        <option value="2000">따라하기 길게 (2.0초)</option>
      </select>
    </div>
  </div>

  <!-- 10개 문장 목록 -->
  <div class="list-card">
    <div class="list-header">10개 문장 목록 (클릭 시 해당 문장 바로 이동)</div>
    <ul class="sentence-list" id="sentenceList"></ul>
  </div>
</div>

<script>
  const sentences = [
    { ko: "어제 퇴근길에 차가 너무 많이 막혔어.", en: "There was crazy traffic on my way home yesterday." },
    { ko: "오늘 너무 정신없이 바빠서 점심도 걸렀어.", en: "It's been a crazy day, so I skipped lunch." },
    { ko: "갑자기 일이 생겨서 오늘 약속 못 갈 것 같아.", en: "Something came up, so I can't make it today." },
    { ko: "그 영화 보는 내내 지루해서 졸았잖아.", en: "It was so boring that I dozed off." },
    { ko: "감기 기운이 있어서 목이 칼칼하고 아파.", en: "I have a sore throat and feel like catching a cold." },
    { ko: "비가 갑자기 쏟아져서 홀딱 다 젖었어.", en: "I got totally soaked in the sudden rain." },
    { ko: "지하철을 반대 방향으로 잘못 타서 늦었어.", en: "I took the wrong subway going the opposite way." },
    { ko: "그거 생각보다 시간이 꽤 오래 걸릴 것 같은데?", en: "It's going to take longer than expected." },
    { ko: "회의 중에 좋은 아이디어가 번뜩 떠올랐어.", en: "An idea hit me during the meeting." },
    { ko: "왜 그런 결정을 내렸는지 도무지 이해가 안 돼.", en: "It makes no sense why they made that decision." }
  ];

  let currentIndex = 0;
  let isRunning = false;
  let synth = window.speechSynthesis;
  let voices = [];

  // 엘리먼트 참조
  const playPauseBtn = document.getElementById("playPauseBtn");
  const stopBtn = document.getElementById("stopBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const currentKo = document.getElementById("currentKo");
  const currentEn = document.getElementById("currentEn");
  const repeatCounter = document.getElementById("repeatCounter");
  const stepBadge = document.getElementById("stepBadge");
  const speakingStatus = document.getElementById("speakingStatus");
  const statusText = document.getElementById("statusText");
  const sentenceList = document.getElementById("sentenceList");
  const speedSelect = document.getElementById("speedSelect");
  const intervalSelect = document.getElementById("intervalSelect");

  function loadVoices() {
    voices = synth.getVoices();
  }
  loadVoices();
  if (speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  // 10개 문장 리스트 렌더링
  sentences.forEach((item, idx) => {
    const li = document.createElement("li");
    li.className = "sentence-item";
    li.id = `item-${idx}`;
    li.innerHTML = `
      <div class="item-ko">${idx + 1}. ${item.ko}</div>
      <div class="item-en">${item.en}</div>
    `;
    li.addEventListener("click", () => {
      stopPlayback();
      currentIndex = idx;
      updateUI();
      startCycle();
    });
    sentenceList.appendChild(li);
  });

  function updateUI() {
    document.querySelectorAll(".sentence-item").forEach((el, i) => {
      el.classList.toggle("playing", i === currentIndex);
    });
    const curr = sentences[currentIndex];
    currentKo.innerText = curr.ko;
    currentEn.innerText = curr.en;
    stepBadge.innerText = `문장 ${currentIndex + 1} / ${sentences.length}`;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function speakText(text, lang, rate = 1.0) {
    return new Promise((resolve) => {
      if (!isRunning) return resolve();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = lang;
      utter.rate = rate;

      // 가능한 최적 보이스 매핑
      if (voices.length > 0) {
        if (lang.startsWith("ko")) {
          const koVoice = voices.find(v => v.lang.includes("ko") || v.lang.includes("KR"));
          if (koVoice) utter.voice = koVoice;
        } else {
          const enVoice = voices.find(v => v.lang.includes("en-US") || v.lang.includes("en_US")) || voices.find(v => v.lang.startsWith("en"));
          if (enVoice) utter.voice = enVoice;
        }
      }

      utter.onend = () => resolve();
      utter.onerror = () => resolve();
      synth.speak(utter);
    });
  }

  // 1개 문장 사이클: 한국어 1회 -> 영어 1회(보통) -> 영어 2회(살짝 천천히/강조)
  async function playSentenceCycle(index) {
    if (!isRunning) return;
    const item = sentences[index];
    const enSpeed = parseFloat(speedSelect.value);
    const delay = parseInt(intervalSelect.value);

    // 1. 한국어 낭독
    currentKo.classList.add("active");
    currentEn.classList.remove("active");
    repeatCounter.innerText = "🗣 [1/3] 한국어 제시";
    statusText.innerText = "한국어 읽는 중";
    speakingStatus.classList.add("speaking");

    await speakText(item.ko, "ko-KR", 1.0);
    currentKo.classList.remove("active");
    await sleep(400);

    if (!isRunning) return;

    // 2. 영어 1회차 낭독
    currentEn.classList.add("active");
    repeatCounter.innerText = "🇺🇸 [2/3] 원어민 영어 1회차";
    statusText.innerText = "영어 1회 읽는 중";
    await speakText(item.en, "en-US", enSpeed);
    await sleep(delay);

    if (!isRunning) return;

    // 3. 영어 2회차 낭독 (따라하기 좋게 약 0.9배속 미세 완화)
    repeatCounter.innerText = "🔁 [3/3] 원어민 영어 2회차 (따라 말해보세요)";
    statusText.innerText = "영어 2회 읽는 중";
    await speakText(item.en, "en-US", Math.max(0.75, enSpeed * 0.92));
    currentEn.classList.remove("active");
    speakingStatus.classList.remove("speaking");
    statusText.innerText = "대기";
    repeatCounter.innerText = "";
    await sleep(delay);
  }

  async function startCycle() {
    isRunning = true;
    playPauseBtn.innerText = "⏸ 일시정지";
    playPauseBtn.classList.remove("btn-primary");

    while (isRunning && currentIndex < sentences.length) {
      updateUI();
      await playSentenceCycle(currentIndex);
      if (!isRunning) break;
      if (currentIndex < sentences.length - 1) {
        currentIndex++;
      } else {
        // 루프 완료 시 첫 번째로 순환
        currentIndex = 0;
        break;
      }
    }

    if (currentIndex === 0 && !isRunning) {
      stopPlayback();
    }
  }

  function stopPlayback() {
    isRunning = false;
    synth.cancel();
    playPauseBtn.innerText = "▶ 전체 자동 재생";
    playPauseBtn.classList.add("btn-primary");
    speakingStatus.classList.remove("speaking");
    statusText.innerText = "정지";
    repeatCounter.innerText = "";
    currentKo.classList.remove("active");
    currentEn.classList.remove("active");
  }

  // 버튼 이벤트
  playPauseBtn.addEventListener("click", () => {
    if (isRunning) {
      stopPlayback();
    } else {
      startCycle();
    }
  });

  stopBtn.addEventListener("click", () => {
    stopPlayback();
    currentIndex = 0;
    updateUI();
  });

  prevBtn.addEventListener("click", () => {
    const wasRunning = isRunning;
    stopPlayback();
    if (currentIndex > 0) currentIndex--;
    updateUI();
    if (wasRunning) startCycle();
  });

  nextBtn.addEventListener("click", () => {
    const wasRunning = isRunning;
    stopPlayback();
    if (currentIndex < sentences.length - 1) currentIndex++;
    updateUI();
    if (wasRunning) startCycle();
  });

  // 초기화
  updateUI();
</script>

</body>
</html>
